<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEST150.DAILY SNS 번역 카드 생성기 V3.2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@500;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
  :root {
    --crimson: #e0454f;
    --pink: #ff8a94;
    --dark-bg: #000000;
    --panel: #1C1C1E;
    --panel-elevated: #2C2C2E;
    --panel-border: rgba(255,255,255,0.08);
    --input-bg: #2C2C2E;
    --text: #F5F5F7;
    --gray: #8E8E93;
    --muted: #8E8E93;
    --btn-sec: #3A3A3C;
    --danger-bg: #3A1F1F;
    --danger-text: #FF8A8A;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.28);
    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 10px;
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --accent-soft: rgba(224, 69, 79, 0.16);
  }
  body.light {
    --dark-bg: #F5F5F7;
    --panel: #FFFFFF;
    --panel-elevated: #F2F2F7;
    --panel-border: rgba(0,0,0,0.06);
    --input-bg: #F2F2F7;
    --text: #1D1D1F;
    --gray: #6E6E73;
    --muted: #6E6E73;
    --btn-sec: #E8E8ED;
    --danger-bg: #FFF0F0;
    --danger-text: #C41E3A;
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    background: var(--dark-bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
    letter-spacing: -0.015em;
    line-height: 1.47;
  }
  input, select, textarea, button { font-family: inherit; font-size: 16px !important; }
  button { cursor: pointer; border: none; color: inherit; }

  .app {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    min-height: 100vh;
  }
  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr; }
    .side-panel {
      position: static !important;
      height: auto !important;
      max-height: none !important;
      border-right: none;
      border-bottom: 1px solid var(--panel-border);
    }
  }

  /* Side */
  .side-panel {
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    padding: 28px 20px 48px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
    max-height: 100vh;
  }
  .side-header { margin-bottom: 22px; }
  .side-header h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.25;
  }
  .side-header .sub {
    font-size: 13px;
    color: var(--gray);
    margin-top: 6px;
  }
  .side-tools {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }
  .color-chip {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    padding: 3px;
    background: var(--input-bg);
    cursor: pointer;
  }
  .icon-btn {
    flex: 1;
    height: 40px;
    border-radius: 10px;
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s var(--ease);
  }
  .icon-btn:hover { border-color: var(--crimson); }

  .sec {
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--pink);
  }
  .sec-head .chev { font-size: 11px; opacity: 0.55; transition: transform 0.2s; color: var(--gray); }
  .sec.collapsed .sec-body { display: none; }
  .sec.collapsed .chev { transform: rotate(-90deg); }
  .sec-body {
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  label.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray);
  }
  label.field input[type="text"],
  label.field select,
  label.field textarea {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: var(--radius-xs);
    padding: 11px 12px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  label.field input:focus,
  label.field select:focus,
  label.field textarea:focus {
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .custom-font-btn {
    background: var(--panel);
    border: 1.5px dashed var(--panel-border);
    color: var(--text);
    font-size: 12px !important;
    padding: 11px 12px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    text-align: center;
    font-weight: 600;
    transition: 0.2s var(--ease);
    width: 100%;
  }
  .custom-font-btn:hover {
    border-color: var(--pink);
    color: var(--pink);
  }

  .side-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
  }
  .btn-primary {
    background: var(--crimson);
    color: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    font-weight: 700;
    font-size: 14px !important;
    transition: all 0.2s var(--ease);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    background: var(--btn-sec);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 13px !important;
  }
  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 13px !important;
  }
  .btn-block { width: 100%; }
  .btn-sm {
    padding: 8px 14px;
    font-size: 13px !important;
    border-radius: 980px;
    min-height: 34px;
  }

  /* Main */
  .main-area {
    padding: 28px 32px 100px;
    background: var(--dark-bg);
  }
  @media (max-width: 767px) {
    .main-area { padding: 16px 14px max(80px, env(safe-area-inset-bottom) + 60px); }
  }

  #cardsWrap { display: flex; flex-direction: column; gap: 20px; }

  .card-editor {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  .card-editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-editor-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--pink);
  }

  .editor-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(240px, 360px);
    gap: 22px;
  }
  .editor-grid > * { min-width: 0; }
  @media (max-width: 900px) {
    .editor-grid { grid-template-columns: 1fr; }
  }

  .fields { display: flex; flex-direction: column; gap: 12px; }
  .row-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 560px) {
    .row-group { grid-template-columns: 1fr; }
  }

  .fields label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray);
  }
  .fields input[type="text"],
  .fields input[type="file"],
  .fields select,
  .fields textarea {
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: var(--radius-xs);
    padding: 11px 12px;
    width: 100%;
    outline: none;
  }
  .fields input:focus,
  .fields select:focus,
  .fields textarea:focus {
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .fields input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--input-bg);
    border-radius: 2px;
    border: none;
    width: 100%;
  }
  .fields input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--crimson);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .fields input[type="file"] {
    border-style: dashed;
    font-size: 12px !important;
    color: var(--gray);
  }

  .section-label {
    font-size: 12px;
    color: var(--pink);
    font-weight: 700;
    margin-top: 2px;
  }
  .checkbox-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
  }
  .checkbox-row label {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text) !important;
    font-size: 12px !important;
    font-weight: 500 !important;
  }
  .checkbox-row input { width: auto; accent-color: var(--crimson); }

  .drop-zone {
    border: 1.5px dashed var(--panel-border);
    padding: 16px;
    border-radius: var(--radius-xs);
    text-align: center;
    color: var(--gray);
    font-size: 13px;
    transition: 0.2s var(--ease);
    cursor: pointer;
  }
  .drop-zone:focus, .drop-zone:hover {
    border-color: var(--crimson);
    color: var(--text);
    background: var(--accent-soft);
  }

  .char-counter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--gray);
    flex-wrap: wrap;
    gap: 6px;
  }
  .char-warning { color: #ffb74d; font-weight: 700; }
  .char-danger { color: #ff5252; font-weight: 700; }
  .line-hint { color: #8ab4f8; font-size: 12px; }

  .preview-zone {
    position: sticky;
    top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  canvas {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius-sm);
    border: 1px solid var(--panel-border);
    background: #f4f4f2;
    box-shadow: var(--shadow-sm);
  }
  .hint {
    font-size: 11px;
    color: var(--gray);
    line-height: 1.4;
  }

  /* Lock */
  #lockScreen input {
    width: 260px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--input-bg);
    color: var(--text);
  }
</style>
</head>
<body>

<div id="lockScreen" style="display:none; position:fixed; inset:0; background:#000; z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:16px;">
  <div style="font-size:22px; font-weight:800; color:#fff;">🔒 잠금 해제</div>
  <input type="password" id="lockInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') tryUnlock()">
  <button class="btn-primary" style="width:260px; padding:14px;" onclick="tryUnlock()">확인</button>
  <div id="lockError" style="color:#ff8a8a; font-size:12px; height:14px;"></div>
</div>

<div id="main-content" class="app">

  <!-- LEFT -->
  <aside class="side-panel">
    <div class="side-header">
      <h1>SNS 번역 카드</h1>
      <p class="sub">WEST150.DAILY · V3.2</p>
      <div class="side-tools">
        <input type="color" id="primaryColor" class="color-chip" value="#e0454f" title="포인트 컬러" onchange="updateAll()">
        <button type="button" class="icon-btn" id="themeBtn" onclick="toggleUiTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <span>공통 설정</span><span class="chev">▼</span>
      </div>
      <div class="sec-body">
        <label class="field">상단 제목
          <input type="text" id="titleText" value="WEST150.DAILY SNS" oninput="updateAll()">
        </label>
        <label class="field">우상단 워터마크
          <input type="text" id="watermarkTop" value="@west150daily" oninput="updateAll()">
        </label>
        <label class="field">좌하단 워터마크
          <input type="text" id="watermarkBottom" value="@west150daily" oninput="updateAll()">
        </label>
        <label class="field">서체 (Font)
          <select id="fontFamily" onchange="updateAll()">
            <option value="'Noto Sans KR'">Noto Sans KR (기본)</option>
            <option value="'Pretendard'">Pretendard (고딕)</option>
            <option value="'Nanum Gothic'">나눔고딕</option>
            <option value="'Nanum Myeongjo'">나눔명조 (명조체)</option>
            <option value="'Gmarket Sans'">Gmarket Sans (제목체)</option>
            <option value="system-ui">시스템 기본 글꼴</option>
          </select>
        </label>
        <button type="button" class="custom-font-btn" onclick="document.getElementById('fontFileInput').click()">📁 내 컴퓨터 폰트 추가</button>
        <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display:none;" onchange="loadCustomFontFile(event)">
      </div>
    </div>

    <div class="side-actions">
      <button class="btn-primary btn-block" onclick="addCard()">+ 새 카드 추가</button>
      <button class="btn-secondary btn-block" onclick="downloadAllAsZip()">📦 모든 카드 ZIP</button>
      <button class="btn-secondary btn-block" onclick="managePassword()">🔒 비밀번호 설정</button>
      <button class="btn-danger btn-block" onclick="clearAllData()">초기화 (전체삭제)</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-area">
    <div id="cardsWrap"></div>
  </main>
</div>

<script>
const W = 1080;
const PAD_X = 44, PAD_TOP = 56, PAD_BOTTOM = 70;
let cards = [];
let grainCache = null;
let grainCacheKey = '';
const PW_KEY = 'sns_card_pw_hash';
const UI_THEME_KEY = 'sns_card_ui_theme';

function applyUiTheme(mode) {
  const light = mode === 'light';
  document.body.classList.toggle('light', light);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = light ? '🌙 다크' : '☀️ 라이트';
  localStorage.setItem(UI_THEME_KEY, light ? 'light' : 'dark');
}
function toggleUiTheme() {
  applyUiTheme(document.body.classList.contains('light') ? 'dark' : 'light');
}
function initUiTheme() {
  applyUiTheme(localStorage.getItem(UI_THEME_KEY) || 'dark');
}

async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function checkLock() {
    const hash = localStorage.getItem(PW_KEY);
    if(!hash) return;
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('main-content').style.display = 'none';
    setTimeout(() => document.getElementById('lockInput')?.focus(), 50);
}

async function tryUnlock() {
    const input = document.getElementById('lockInput').value;
    const hash = localStorage.getItem(PW_KEY);
    const inputHash = await sha256(input);
    if(inputHash === hash) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('main-content').style.display = '';
        document.getElementById('main-content').classList.add('app');
    } else {
        document.getElementById('lockError').textContent = '비밀번호가 틀렸습니다.';
        document.getElementById('lockInput').value = '';
        document.getElementById('lockInput').focus();
    }
}

async function managePassword() {
    const hasPw = !!localStorage.getItem(PW_KEY);
    if(hasPw) {
        const wantsChange = confirm('비밀번호를 변경하려면 확인, 삭제하려면 취소를 눌러주세요.');
        const cur = prompt('현재 비밀번호를 입력하세요:');
        if(cur === null) return;
        if(await sha256(cur) !== localStorage.getItem(PW_KEY)) { alert('현재 비밀번호가 일치하지 않습니다.'); return; }
        if(wantsChange) {
            const np = prompt('새 비밀번호를 입력하세요:');
            if(!np) return;
            localStorage.setItem(PW_KEY, await sha256(np));
            alert('비밀번호가 변경되었습니다.');
        } else {
            localStorage.removeItem(PW_KEY);
            alert('비밀번호 잠금이 해제되었습니다.');
        }
    } else {
        const np = prompt('설정할 비밀번호를 입력하세요:');
        if(!np) return;
        const confirmPw = prompt('확인을 위해 한 번 더 입력해주세요:');
        if(np !== confirmPw) { alert('비밀번호가 서로 다릅니다. 다시 시도해주세요.'); return; }
        localStorage.setItem(PW_KEY, await sha256(np));
        alert('비밀번호가 설정되었습니다. 다음 접속부터 잠금이 적용됩니다.\n(주의: 브라우저 개발자도구를 사용하면 우회될 수 있는 간단한 보호 기능입니다.)');
    }
}

function openFontDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('FontStorageDB', 1);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('fonts')) {
        db.createObjectStore('fonts', { keyPath: 'name' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveFontToDB(name, buffer) {
  const db = await openFontDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('fonts', 'readwrite');
    tx.objectStore('fonts').put({ name, buffer });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getAllFontsFromDB() {
  const db = await openFontDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('fonts', 'readonly');
    const request = tx.objectStore('fonts').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function clearFontDB() {
  const db = await openFontDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('fonts', 'readwrite');
    tx.objectStore('fonts').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function restoreCustomFonts() {
  try {
    const fontList = await getAllFontsFromDB();
    const select = document.getElementById('fontFamily');
    for (const item of fontList) {
      const font = new FontFace(item.name, item.buffer);
      await font.load();
      document.fonts.add(font);
      const option = document.createElement('option');
      option.value = `'${item.name}'`;
      option.textContent = `⭐ ${item.name} (사용자 추가)`;
      select.appendChild(option);
    }
  } catch (err) {
    console.error('저장된 폰트를 로드하는 중 오류가 발생했습니다:', err);
  }
}

window.onload = async () => {
  initUiTheme();
  checkLock();
  await document.fonts.ready;
  await restoreCustomFonts();

  const saved = localStorage.getItem('truth_translate_data_v3');
  if(saved) {
    try {
      const parsed = JSON.parse(saved);
      document.getElementById('titleText').value = parsed.titleText || 'WEST150.DAILY SNS';
      document.getElementById('watermarkTop').value = parsed.watermarkTop || '@west150daily';
      document.getElementById('watermarkBottom').value = parsed.watermarkBottom || '@west150daily';
      document.getElementById('fontFamily').value = parsed.fontFamily || "'Noto Sans KR'";
      document.getElementById('primaryColor').value = parsed.primaryColor || '#e0454f';

      if(parsed.cards && parsed.cards.length > 0) {
        parsed.cards.forEach(c => addCard(c));
      } else {
        addCard();
      }
    } catch (e) {
      console.error(e);
      addCard();
    }
  } else {
    addCard();
  }
  updateAll();
};

async function loadCustomFontFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fontName = file.name.substring(0, file.name.lastIndexOf('.')).replace(/[^a-zA-Z0-9가-힣_-]/g, '');
  try {
    const arrayBuffer = await file.arrayBuffer();
    const font = new FontFace(fontName, arrayBuffer);
    await font.load();
    document.fonts.add(font);
    await saveFontToDB(fontName, arrayBuffer);
    const select = document.getElementById('fontFamily');
    const option = document.createElement('option');
    option.value = `'${fontName}'`;
    option.textContent = `⭐ ${fontName} (사용자 추가)`;
    select.appendChild(option);
    select.value = `'${fontName}'`;
    alert(`'${fontName}' 폰트가 정상적으로 등록되었으며 영구 저장되었습니다!`);
    updateAll();
  } catch (err) {
    alert('폰트 파일을 로드하는데 실패했습니다. 올바른 TTF/OTF/WOFF 파일인지 확인해주세요.');
    console.error(err);
  }
}

function updateCharCount(id) {
  const text = document.getElementById(`trans-${id}`)?.value || '';
  const total = text.length;
  const noSpace = text.replace(/\s/g, '').length;
  const infoEl = document.getElementById(`char-info-${id}`);
  const warnEl = document.getElementById(`char-warn-${id}`);
  if (!infoEl) return;

  infoEl.innerText = `${total}자 (공백 제외 ${noSpace}자)`;

  if (total > 300) {
    warnEl.innerText = '⚠️ 번역문이 너무 깁니다 (300자 초과)';
    warnEl.className = 'char-danger';
  } else if (total > 150) {
    warnEl.innerText = '💡 번역문이 다소 길어요';
    warnEl.className = 'char-warning';
  } else {
    warnEl.innerText = '';

}

function updateLineHint(id, lines) {
  const el = document.getElementById(`line-hint-${id}`);
  if (!el) return;
  if (!lines) { el.textContent = ''; return; }
  let tip = `약 ${lines}줄`;
  if (lines >= 10) tip += ' · 줄 많음';
  else if (lines >= 6) tip += ' · 권장 범위 상단';
  else tip += ' · 읽기 좋은 편';
  el.textContent = tip;
}

async function handleImg(id) {

async function handlePaste(e, id) {
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let item of items) {
    if (item.type.indexOf("image") !== -1) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = (event) => {
        const card = cards.find(c => c.id === id);
        card.imgData = event.target.result;
        updateCard(id);
      };
      reader.readAsDataURL(blob);
    }
  }
}

function updateAll() {

function parseMarkup(text){
  const normalized = (text || '').replace(/[＊✱]/g, '*');
  const lines = normalized.split('\n');
  return lines.map(line => {
    const parts = line.split('**');
    return parts.map((p, i) => ({ text: p, highlight: i % 2 !== 0 }));
  });
}

function fontStack(size, weight){
  const family = document.getElementById('fontFamily').value;
  return `${weight} ${size}px ${family}, -apple-system, sans-serif`;
}

function drawRichText(ctx, lineRuns, x, y, maxWidth, fontSize, lineGap, colorNormal, colorHighlight, weightNormal, weightHighlight, measureOnly=false){
  let curY = y;
  const lineH = fontSize * lineGap;
  let visualLines = 0;

  lineRuns.forEach(runs => {
    let curX = x;
    let lineStarted = false;
    runs.forEach(run => {
      ctx.font = fontStack(fontSize, run.highlight ? weightHighlight : weightNormal);
      ctx.fillStyle = run.highlight ? colorHighlight : colorNormal;
      const words = run.text.split(/(\s+)/);
      words.forEach(word => {
        const ww = ctx.measureText(word).width;
        if(curX + ww > x + maxWidth && word.trim() !== ''){
          curX = x; curY += lineH;
          visualLines++;
          lineStarted = true;
        }
        if(!measureOnly) ctx.fillText(word, curX, curY);
        curX += ww;
        if (!lineStarted && word.length) { visualLines++; lineStarted = true; }
      });
    });
    curY += lineH;
    if (!lineStarted) visualLines++;
  });
  return { y: curY, lines: visualLines };
}

function loadImage(src){
  return new Promise(res => {
    if (!src) return res(null);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r){
  const radius = Math.max(0, Math.min(r, Math.abs(w)/2, Math.abs(h)/2));
  ctx.beginPath();
  if (radius <= 0) {
    ctx.rect(x, y, w, h);
  } else {
    ctx.moveTo(x+radius, y);
    ctx.arcTo(x+w, y, x+w, y+h, radius);
    ctx.arcTo(x+w, y+h, x, y+h, radius);
    ctx.arcTo(x, y+h, x, y, radius);
    ctx.arcTo(x, y, x+w, y, radius);
  }
  ctx.closePath();
}

function getGrainCanvas(cw, ch, amount) {
  const key = `${cw}x${ch}_${amount}`;
  if (grainCache && grainCacheKey === key) return grainCache;
  const g = document.createElement('canvas');
  const gw = Math.max(120, Math.floor(cw / 4));
  const gh = Math.max(120, Math.floor(ch / 4));
  g.width = gw; g.height = gh;
  const gctx = g.getContext('2d');
  const img = gctx.createImageData(gw, gh);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = Math.floor(30 + (amount / 100) * 120);
  }
  gctx.putImageData(img, 0, 0);
  grainCache = g; grainCacheKey = key;
  return g;
}

function applyGrain(ctx, cw, ch, amount) {
  const noise = getGrainCanvas(cw, ch, amount);
  ctx.save();
  ctx.globalAlpha = 0.15 + (amount / 100) * 0.3;
  ctx.drawImage(noise, 0, 0, cw, ch);
  ctx.restore();
}

function drawThinFrame(ctx, cw, ch, color) {
  const inset = 14;
  ctx.save();
  ctx.strokeStyle = color || 'rgba(30,30,30,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(inset + 0.5, inset + 0.5, cw - inset * 2, ch - inset * 2);
  ctx.restore();
}

function drawSafeGuide(ctx, cw, ch) {
  const topH = ch * 0.12;
  const botH = ch * 0.14;
  ctx.save();
  ctx.fillStyle = 'rgba(224,69,79,0.14)';
  ctx.fillRect(0, 0, cw, topH);
  ctx.fillRect(0, ch - botH, cw, botH);
  ctx.setLineDash([8, 6]);
  ctx.strokeStyle = 'rgba(224,69,79,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, topH); ctx.lineTo(cw, topH);
  ctx.moveTo(0, ch - botH); ctx.lineTo(cw, ch - botH);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = fontStack(18, '600');
  ctx.fillStyle = 'rgba(200,60,70,0.9)';
  ctx.textAlign = 'center';
  ctx.fillText('SAFE · 상단 UI', cw / 2, topH * 0.55);
  ctx.fillText('SAFE · 하단 UI', cw / 2, ch - botH * 0.4);
  ctx.textAlign = 'left';
  ctx.restore();
}

async function updateCard(id, opts = {}) {
  const skipGuide = !!opts.skipGuide;
  const cardData = cards.find(c => c.id === id);
  const canvas = document.getElementById(`canvas-${id}`);
  if(!canvas || !cardData) return;
  const ctx = canvas.getContext('2d');

  updateCharCount(id);

  const translation = document.getElementById(`trans-${id}`).value;
  const yPercent = Number(document.getElementById(`yOff-${id}`).value);
  const zoomVal = Number(document.getElementById(`zoom-${id}`).value) / 100;
  const titleText = document.getElementById('titleText').value;
  const wmTop = document.getElementById('watermarkTop').value;
  const wmBottom = document.getElementById('watermarkBottom').value;
  const primaryColor = document.getElementById('primaryColor').value;
  const cardTheme = document.getElementById(`theme-${id}`).value;
  const aspectRatio = document.getElementById(`aspect-${id}`).value;
  const fontSize = Number(document.getElementById(`fontSize-${id}`).value) || 36;
  const langLabel = (document.getElementById(`lang-${id}`).value || '').trim();
  const roundCorners = document.getElementById(`round-${id}`).checked;
  const useShadow = document.getElementById(`shadow-${id}`).checked;
  const thinFrame = document.getElementById(`frame-${id}`).checked;
  const useGrain = document.getElementById(`grain-${id}`).checked;
  const grainAmt = Number(document.getElementById(`grainAmt-${id}`)?.value || 18);
  const safeGuide = document.getElementById(`safe-${id}`).checked;
  const imgBlur = Number(document.getElementById(`blur-${id}`).value) || 0;
  const imgBright = Number(document.getElementById(`bright-${id}`).value) || 100;
  const imgGradient = document.getElementById(`grad-${id}`).checked;
  const radius = roundCorners ? 20 : 0;

  const isDark = (cardTheme === 'dark');
  const cardBgColor = isDark ? '#141414' : '#F8F9FA';
  const cardBorderColor = isDark ? '#2A2A2A' : '#E2E8F0';
  const textNormalColor = isDark ? '#FFFFFF' : '#1A202C';
  const textHighlightColor = primaryColor;
  const labelTextColor = primaryColor;

  let img = null;
  if(cardData.imgData) img = await loadImage(cardData.imgData);

  const runsTrans = parseMarkup(translation);

  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = 6000;
  const tCtx = tmp.getContext('2d');

  const transPadX = 34, transPadY = 36;
  const cardW = W - PAD_X*2;
  const transInnerW = cardW - transPadX*2 - 22;
  const measured = drawRichText(tCtx, runsTrans, 0, 0, transInnerW, fontSize, 1.8, textNormalColor, textHighlightColor, '400', '800', true);
  const transH = measured.y;
  updateLineHint(id, measured.lines);

  const headerH = 32*1.3 + 44;
  const gapBetween = 30;
  const langExtra = langLabel ? 28 : 0;
  const transCardH = transPadY + 30 + langExtra + transH + transPadY - 10;

  let totalH, postCardH, postCardW = cardW, postCardX = PAD_X;

  if (aspectRatio === '1:1') {
    totalH = 1080;
    const availableH = totalH - PAD_TOP - headerH - gapBetween - transCardH - PAD_BOTTOM;
    postCardH = Math.max(180, availableH);
  } else if (aspectRatio === '4:5') {
    totalH = 1350;
    const availableH = totalH - PAD_TOP - headerH - gapBetween - transCardH - PAD_BOTTOM;
    postCardH = Math.max(180, availableH);
  } else {
    postCardW = cardW * 0.72;
    postCardX = PAD_X + (cardW - postCardW) / 2;
    if(img){
      postCardH = img.height * (postCardW / img.width);
    } else {
      postCardH = 300;
    }
    totalH = Math.round(PAD_TOP + headerH + postCardH + gapBetween + transCardH + PAD_BOTTOM);
  }

  canvas.height = totalH;

  ctx.fillStyle = '#f4f4f2';
  ctx.fillRect(0, 0, W, totalH);

  ctx.font = fontStack(15, '700');
  ctx.fillStyle = '#9a9a97';
  ctx.textAlign = 'right';
  ctx.fillText(wmTop, W - PAD_X, PAD_TOP + 4);
  ctx.textAlign = 'left';

  let cy = PAD_TOP + 40;
  ctx.font = fontStack(32, '900');
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText(titleText, PAD_X, cy);
  cy += 44;

  const cardX = PAD_X;

  if (useShadow) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.18)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#fff';
    roundRect(ctx, postCardX, cy, postCardW, postCardH, radius);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  roundRect(ctx, postCardX, cy, postCardW, postCardH, radius);
  ctx.clip();
  if(img){
    const sW = img.width, sH = img.height;
    const baseAspect = postCardW / sW;
    const safeZoom = Math.max(1, zoomVal);
    const viewH = (postCardH / baseAspect) / safeZoom;
    const viewW = sW / safeZoom;
    const maxDX = Math.max(0, sW - viewW);
    const maxDY = Math.max(0, sH - viewH);
    const dx = maxDX * 0.5;
    const dy = maxDY * (yPercent / 100);

    ctx.save();
    const filters = [];
    if (imgBlur > 0) filters.push(`blur(${imgBlur}px)`);
    if (imgBright !== 100) filters.push(`brightness(${imgBright / 100})`);
    if (filters.length) ctx.filter = filters.join(' ');
    if (imgBlur > 0) {
      const scale = 1 + imgBlur / 80;
      const cx = postCardX + postCardW / 2;
      const cy2 = cy + postCardH / 2;
      ctx.translate(cx, cy2);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy2);
    }
    ctx.drawImage(img, dx, dy, viewW, viewH, postCardX, cy, postCardW, postCardH);
    ctx.restore();

    if (imgGradient) {
      const g = ctx.createLinearGradient(0, cy + postCardH * 0.55, 0, cy + postCardH);
      g.addColorStop(0, 'rgba(244,244,242,0)');
      g.addColorStop(1, 'rgba(244,244,242,0.55)');
      ctx.fillStyle = g;
      ctx.fillRect(postCardX, cy, postCardW, postCardH);
    }
  } else {
    ctx.fillStyle = '#e5e5e3';
    ctx.fillRect(postCardX, cy, postCardW, postCardH);
    ctx.fillStyle = '#9a9a97';
    ctx.font = fontStack(22, '500');
    ctx.textAlign = 'center';
    ctx.fillText('스크린샷을 업로드하세요', postCardX + postCardW/2, cy + postCardH/2);
    ctx.textAlign = 'left';
  }
  ctx.restore();

  ctx.strokeStyle = '#e5e5e3'; ctx.lineWidth = 2;
  roundRect(ctx, postCardX, cy, postCardW, postCardH, radius);
  ctx.stroke();

  let transY0 = cy + postCardH + gapBetween;

  if (useShadow) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.14)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 6;
    ctx.fillStyle = cardBgColor;
    roundRect(ctx, cardX, transY0, cardW, transCardH, radius);
    ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = cardBgColor;
  ctx.strokeStyle = cardBorderColor; ctx.lineWidth = 2;
  roundRect(ctx, cardX, transY0, cardW, transCardH, radius);
  ctx.fill(); ctx.stroke();

  const barX = cardX + transPadX;
  let barY = transY0 + transPadY;
  ctx.fillStyle = primaryColor;
  ctx.fillRect(barX, barY, 4, 20);
  ctx.font = fontStack(15, '700');
  ctx.fillStyle = labelTextColor;
  ctx.fillText('한국어 번역', barX + 16, barY + 15);

  if (langLabel) {
    ctx.font = fontStack(13, '600');
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.4)';
    ctx.fillText(langLabel, barX + 16, barY + 38);
    barY += 22;
  }

  let transBodyY = barY + 30 + fontSize*0.9;
  drawRichText(ctx, runsTrans, cardX + transPadX + 22, transBodyY, transInnerW, fontSize, 1.8, textNormalColor, textHighlightColor, '400', '800');

  ctx.font = fontStack(13, '400');
  ctx.fillStyle = '#cfcfcb';
  ctx.fillText(wmBottom, PAD_X, totalH - 30);

  if (useGrain) applyGrain(ctx, W, totalH, grainAmt);
  if (thinFrame) drawThinFrame(ctx, W, totalH, 'rgba(40,40,40,0.4)');

  if (!skipGuide && safeGuide && (aspectRatio === '1:1' || aspectRatio === '4:5')) {
    drawSafeGuide(ctx, W, totalH);
  }

  saveData();
}

async function downloadCanvas(id){
  await updateCard(id, { skipGuide: true });
  const canvas = document.getElementById(`canvas-${id}`);
  const name = `truth_card_${id}.png`;
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  const file = new File([blob], name, { type: 'image/png' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name });
      await updateCard(id);
      return;
    } catch (err) {}
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const url = URL.createObjectURL(blob);
  if (isIOS) {
    window.open(url, '_blank');
    alert('새 탭에 이미지가 열립니다. 이미지를 길게 눌러 "사진에 저장"을 선택해주세요.');
  } else {
    const link = document.createElement('a');
    link.download = name;
    link.href = url;
    link.click();
  }
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  await updateCard(id);
}

async function downloadAllAsZip(){
  const zip = new JSZip();
  for(let i=0; i<cards.length; i++){
    await updateCard(cards[i].id, { skipGuide: true });
    const canvas = document.getElementById(`canvas-${cards[i].id}`);
    const blob = await new Promise(res => canvas.toBlob(res));
    zip.file(`${(i+1).toString().padStart(2,'0')}_truth_card.png`, blob);
  }
  zip.generateAsync({type:"blob"}).then(content => saveAs(content, "truth_translate_cards.zip"));
  for (const c of cards) await updateCard(c.id);
}
