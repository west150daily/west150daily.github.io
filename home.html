<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: rgba(0,0,0,0.08);
    --accent: #1e3a5f;
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --radius: 16px;
    --header-h: 64px;
  }
  [data-theme="dark"] {
    --bg: #121113;
    --surface: #1c1b1e;
    --text: #f5f5f7;
    --text-secondary: #98989d;
    --border: rgba(255,255,255,0.1);
    --shadow: 0 4px 24px rgba(0,0,0,0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    transition: background 0.3s, color 0.3s;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: var(--header-h);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
  }
  .header-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
  }
  .search-wrap {
    flex: 1;
    max-width: 380px;
    position: relative;
  }
  .search-input {
    width: 100%;
    height: 40px;
    padding: 0 16px 0 40px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    opacity: 0.5;
    pointer-events: none;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .icon-btn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .color-picker {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    padding: 0;
    background: none;
  }
  .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
  .color-picker::-webkit-color-swatch { border: none; border-radius: 50%; }

  .mobile-search-btn { display: none; }
  .mobile-search-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--bg);
    padding: 16px;
    flex-direction: column;
  }
  .mobile-search-overlay.active { display: flex; }
  .mobile-search-header { display: flex; gap: 12px; margin-bottom: 16px; }
  .mobile-search-input {
    flex: 1;
    height: 44px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 150;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
  }
  .menu-overlay.active { opacity: 1; visibility: visible; }
  .side-menu {
    position: fixed;
    top: 0;
    right: 0;
    width: min(320px, 85vw);
    height: 100%;
    background: var(--surface);
    z-index: 160;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 30px rgba(0,0,0,0.12);
  }
  .side-menu.active { transform: translateX(0); }
  .side-menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .side-menu-header h2 { font-size: 1.15rem; font-weight: 700; }
  .side-menu-list { flex: 1; overflow-y: auto; padding: 12px 0; }
  .side-menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 24px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 1rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s;
  }
  .side-menu-item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .side-menu-item.active {
    color: var(--accent);
    font-weight: 700;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .side-menu-count {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-left: 8px;
  }
  .side-menu-section {
    padding: 16px 24px 8px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .hero {
    min-height: 52vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 70px 24px 48px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% 40%, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 50%),
      radial-gradient(ellipse 60% 40% at 80% 60%, color-mix(in srgb, var(--accent) 6%, transparent) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, color-mix(in srgb, var(--text) 3%, transparent) 39px, color-mix(in srgb, var(--text) 3%, transparent) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, color-mix(in srgb, var(--text) 3%, transparent) 39px, color-mix(in srgb, var(--text) 3%, transparent) 40px);
    pointer-events: none;
    opacity: 0.7;
  }
  .hero h1 {
    position: relative;
    font-size: clamp(2.6rem, 7.5vw, 5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 18px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.9s ease forwards 0.15s;
  }
  .hero .tagline {
    position: relative;
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    color: var(--text-secondary);
    max-width: 520px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.9s ease forwards 0.35s;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .about {
    max-width: 680px;
    margin: 0 auto 70px;
    padding: 0 24px;
    text-align: center;
  }
  .about h2 {
    font-size: 1.55rem;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }
  .about p {
    font-size: 1.08rem;
    color: var(--text-secondary);
    line-height: 1.75;
  }

  .archive-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }
  .section-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .section-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .current-filter {
    font-size: 0.88rem;
    color: var(--text-secondary);
    background: color-mix(in srgb, var(--text) 6%, transparent);
    padding: 6px 14px;
    border-radius: 20px;
  }
  .sort-select {
    height: 36px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.88rem;
    cursor: pointer;
    outline: none;
  }
  .sort-select:focus { border-color: var(--accent); }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 22px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    border: 1px solid var(--border);
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.1);
  }
  [data-theme="dark"] .card:hover {
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .card-img-wrap {
    aspect-ratio: 1;
    overflow: hidden;
    background: color-mix(in srgb, var(--text) 6%, transparent);
    position: relative;
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s, opacity 0.35s;
    opacity: 0;
  }
  .card-img-wrap img.loaded { opacity: 1; }
  .card:hover .card-img-wrap img { transform: scale(1.04); }
  .skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--text) 6%, transparent) 25%,
      color-mix(in srgb, var(--text) 12%, transparent) 50%,
      color-mix(in srgb, var(--text) 6%, transparent) 75%);
    background-size: 200% 100%;
    animation: skeleton 1.4s ease infinite;
  }
  .card-img-wrap img.loaded + .skeleton { display: none; }
  @keyframes skeleton {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .new-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 6px;
    z-index: 2;
  }
  .card-body { padding: 15px 17px 17px; }
  .card-cat {
    font-size: 0.73rem;
    font-weight: 600;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-cat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 0.98rem;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 5px;
  }
  .card-date {
    font-size: 0.78rem;
    color: var(--text-secondary);
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: var(--text-secondary);
  }
  .empty-state svg {
    width: 60px;
    height: 60px;
    margin-bottom: 14px;
    opacity: 0.35;
  }
  .empty-state p { font-size: 1.05rem; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .lightbox.active { display: flex; opacity: 1; }
  .lightbox-content {
    position: relative;
    max-width: 920px;
    width: 100%;
    max-height: 90vh;
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .lightbox-img-wrap {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
  }
  .lightbox-img-wrap img {
    max-width: 100%;
    max-height: 65vh;
    object-fit: contain;
  }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: background 0.2s;
  }
  .lightbox-nav:hover { background: rgba(0,0,0,0.8); }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-info {
    padding: 18px 22px;
    border-top: 1px solid var(--border);
  }
  .lightbox-info h3 {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .lightbox-meta {
    font-size: 0.88rem;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }
  .lightbox-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary {
    background: color-mix(in srgb, var(--text) 8%, transparent);
    color: var(--text);
  }
  .btn-share-x { background: #000; color: #fff; }
  .btn-share-threads { background: #000; color: #fff; }
  .lightbox-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .ios-save-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .ios-save-overlay.active { display: flex; }
  .ios-save-overlay img {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
  }
  .ios-save-msg { color: #fff; margin-top: 18px; text-align: center; }
  .ios-save-close {
    margin-top: 22px;
    padding: 12px 28px;
    border-radius: 12px;
    background: #fff;
    color: #000;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }

  .back-top {
    position: fixed;
    bottom: 26px;
    right: 26px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: all 0.3s;
    z-index: 90;
  }
  .back-top.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .back-top:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  footer {
    border-top: 1px solid var(--border);
    padding: 44px 24px;
    text-align: center;
  }
  .social-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 22px;
  }
  .social-links a {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    background: color-mix(in srgb, var(--text) 6%, transparent);
    transition: background 0.2s, color 0.2s;
  }
  .social-links a:hover {
    background: var(--accent);
    color: #fff;
  }
  .copyright {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  @media (max-width: 768px) {
    .search-wrap { display: none; }
    .mobile-search-btn { display: flex; }
    .hero { min-height: 46vh; padding: 50px 20px 36px; }
    .gallery { grid-template-columns: 1fr; gap: 16px; }
    .lightbox-nav { width: 38px; height: 38px; }
  }
</style>
</head>

  <section class="about">
    <h2>About</h2>
    <p>
      WEST150은 하나의 틀에 갇히지 않습니다.<br>
      정치와 세계 뉴스, 신학의 깊이를 카드로 담고, 음악으로 또 다른 언어를 이야기합니다.<br>
      기록하고, 정리하고, 만듭니다 — WEST150의 방식으로.
    </p>
  </section>

  <section class="archive-section" id="archive">
    <div class="section-header">
      <h2 class="section-title">Archive</h2>
      <div class="section-controls">
        <span class="current-filter" id="currentFilterLabel">전체 · 랜덤</span>
        <select class="sort-select" id="sortSelect" aria-label="정렬">
          <option value="random">랜덤</option>
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="title">제목순</option>
        </select>
      </div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="lightbox-img-wrap">
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="이전">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <img id="lightboxImg" src="" alt="">
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="다음">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="lightbox-info">
        <h3 id="lightboxTitle"></h3>
        <div class="lightbox-meta" id="lightboxMeta"></div>
        <div class="lightbox-actions">
          <button class="btn btn-primary" id="downloadBtn">이미지 저장</button>
          <button class="btn btn-share-x" id="shareX">X에 공유</button>
          <button class="btn btn-share-threads" id="shareThreads">Threads 공유</button>
          <button class="btn btn-secondary" id="lightboxClose2">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ios-save-overlay" id="iosSaveOverlay">
    <img id="iosSaveImg" src="" alt="저장할 이미지">
    <p class="ios-save-msg">이미지를 길게 눌러서 저장하세요</p>
    <button class="ios-save-close" id="iosSaveClose">닫기</button>
  </div>

  <button class="back-top" id="backTop" aria-label="맨 위로">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <footer>
    <div class="social-links" id="socialLinks"></div>
    <p class="copyright">© <span id="year"></span> WEST150 OFFICIAL</p>
  </footer>

<script>
/* =====================================================
   데이터 (여기만 수정)
===================================================== */
const NEW_BADGE_DAYS = 7;
const OG_IMAGE = 'assets/og-image.jpg';

const CATEGORIES = [
  { id: 'all', label: '전체' },
  { id: 'cardnews', label: '카드뉴스', sub: ['정치', '세계정치'], color: '#3B5BA5' },
  { id: 'theology', label: '신학 카드', color: '#8B5E2A' },
  { id: 'quote', label: '인용 · 발언 카드', color: '#5C6B73' },
  { id: 'factcheck', label: '팩트체크 카드', color: '#B0413E' },
  { id: 'timeline', label: '타임라인 · 리스트 카드', color: '#4A7A6D' },
  { id: 'music', label: '음악', color: '#6C4A9E' },
];

const WORKS = [
  // { id: 1, title: "제목", category: "cardnews", sub: "정치", img: "images/1.jpg", date: "2026-08-01", caption: "설명" },
];

const SOCIAL_LINKS = [
  { platform: 'x', label: 'X', url: 'https://x.com/west150daily' },
  { platform: 'threads', label: 'Threads', url: 'https://www.threads.net/@west150daily' },
  { platform: 'email', label: 'Email', url: 'mailto:west150official@gmail.com' },
];

/* =====================================================
   상태
===================================================== */
let currentCategory = 'all';
let currentSearch = '';
let currentSort = 'random';
let currentWork = null;
let filteredList = [];
let randomOrderIds = [];

/* =====================================================
   유틸
===================================================== */
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isNewWork(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  const now = new Date();
  const diff = (now - d) / (1000 * 60 * 60 * 24);
  return diff >= 0 && diff <= NEW_BADGE_DAYS;
}

function getWorkShareUrl(id) {
  const url = new URL(window.location.href);
  url.searchParams.set('work', id);
  return url.toString();
}

async function downloadImage(url, filename = 'west150-work.png') {
  try {
    if (isIOS()) {
      document.getElementById('iosSaveImg').src = url;
      document.getElementById('iosSaveOverlay').classList.add('active');
      return;
    }
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    window.open(url, '_blank');
    alert('새 탭에서 이미지를 길게 눌러 저장해 주세요.');
  }
}

function rebuildRandomOrder() {
  randomOrderIds = shuffle(WORKS.map(w => w.id));
}

/* =====================================================
   URL 동기화
===================================================== */
function updateUrlState(options = {}) {
  const url = new URL(window.location.href);
  if (currentCategory && currentCategory !== 'all') {
    url.searchParams.set('cat', currentCategory);
  } else {
    url.searchParams.delete('cat');
  }
  if (currentSort && currentSort !== 'random') {
    url.searchParams.set('sort', currentSort);
  } else {
    url.searchParams.delete('sort');
  }
  if (options.workId != null) {
    url.searchParams.set('work', options.workId);
  } else if (options.clearWork) {
    url.searchParams.delete('work');
  }
  const method = options.push ? 'pushState' : 'replaceState';
  history[method](null, '', url.pathname + url.search);
}

function parseUrlState() {
  const params = new URLSearchParams(window.location.search);
  const cat = params.get('cat');
  const sort = params.get('sort');
  const work = params.get('work');

  if (cat && CATEGORIES.some(c => c.id === cat)) {
    currentCategory = cat;
  }
  if (sort && ['random', 'newest', 'oldest', 'title'].includes(sort)) {
    currentSort = sort;
    document.getElementById('sortSelect').value = sort;
  }
  return work ? parseInt(work, 10) : null;
}

/* =====================================================
   테마
===================================================== */
function initTheme() {
  const saved = localStorage.getItem('west150-theme');
  let theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);

  const accent = localStorage.getItem('west150-accent') || '#1e3a5f';
  document.documentElement.style.setProperty('--accent', accent);
  document.getElementById('accentPicker').value = accent;
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  icon.innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
    : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
}

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('west150-theme', next);
  updateThemeIcon(next);
});

document.getElementById('accentPicker').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--accent', e.target.value);
  localStorage.setItem('west150-accent', e.target.value);
});

/* =====================================================
   사이드 메뉴 + 포커스 트랩
===================================================== */
const sideMenu = document.getElementById('sideMenu');
const menuOverlay = document.getElementById('menuOverlay');
const menuBtn = document.getElementById('menuBtn');
let focusableInMenu = [];
let previouslyFocused = null;

function getFocusable(container) {
  return Array.from(container.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )).filter(el => !el.disabled && el.offsetParent !== null);
}

function openMenu() {
  previouslyFocused = document.activeElement;
  sideMenu.classList.add('active');
  menuOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  focusableInMenu = getFocusable(sideMenu);
  if (focusableInMenu.length) focusableInMenu[0].focus();
}

function closeMenu() {
  sideMenu.classList.remove('active');
  menuOverlay.classList.remove('active');
  document.body.style.overflow = '';
  if (previouslyFocused) previouslyFocused.focus();
}

menuBtn.addEventListener('click', openMenu);
document.getElementById('menuClose').addEventListener('click', closeMenu);
menuOverlay.addEventListener('click', closeMenu);

sideMenu.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || !sideMenu.classList.contains('active')) return;
  focusableInMenu = getFocusable(sideMenu);
  if (focusableInMenu.length === 0) return;
  const first = focusableInMenu[0];
  const last = focusableInMenu[focusableInMenu.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) {
      e.preventDefault();
      last.focus();
    }
  } else {
    if (document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});

function getCategoryCount(catId) {
  if (catId === 'all') return WORKS.length;
  return WORKS.filter(w => w.category === catId).length;
}

function renderSideMenu() {
  const list = document.getElementById('sideMenuList');
  let html = `<div class="side-menu-section">카테고리</div>`;
  html += CATEGORIES.map(c => `
    <button class="side-menu-item ${c.id === currentCategory ? 'active' : ''}" data-id="${c.id}">
      <span>${c.label}</span>
      <span class="side-menu-count">(${getCategoryCount(c.id)})</span>
    </button>
  `).join('');
  list.innerHTML = html;

  list.querySelectorAll('.side-menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const newCat = btn.dataset.id;
      if (newCat !== currentCategory) {
        currentCategory = newCat;
        if (currentSort === 'random') rebuildRandomOrder();
      }
      renderSideMenu();
      renderGallery();
      updateUrlState();
      closeMenu();
    });
  });
}

/* =====================================================
   검색
===================================================== */
function setupSearch() {
  const desktop = document.getElementById('searchInput');
  const mobile = document.getElementById('mobileSearchInput');
  const overlay = document.getElementById('mobileSearchOverlay');

  const handle = (val) => {
    currentSearch = val.trim().toLowerCase();
    renderGallery();
  };
  desktop.addEventListener('input', e => handle(e.target.value));
  mobile.addEventListener('input', e => {
    handle(e.target.value);
    desktop.value = e.target.value;
  });
  document.getElementById('mobileSearchBtn').addEventListener('click', () => {
    overlay.classList.add('active');
    mobile.focus();
  });
  document.getElementById('mobileSearchClose').addEventListener('click', () => {
    overlay.classList.remove('active');
  });
}

/* / 단축키 */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;
    e.preventDefault();
    const input = document.getElementById('searchInput');
    if (window.innerWidth <= 768) {
      document.getElementById('mobileSearchOverlay').classList.add('active');
      document.getElementById('mobileSearchInput').focus();
    } else {
      input.focus();
    }
  }
});

/* =====================================================
   정렬 + 필터 + 갤러리
===================================================== */
document.getElementById('sortSelect').addEventListener('change', (e) => {
  const prev = currentSort;
  currentSort = e.target.value;
  if (currentSort === 'random' && prev !== 'random') {
    rebuildRandomOrder();
  }
  renderGallery();
  updateUrlState();
});

function getFilteredWorks() {
  let list = WORKS.filter(w => {
    const catMatch = currentCategory === 'all' || w.category === currentCategory;
    const searchMatch = !currentSearch ||
      (w.title && w.title.toLowerCase().includes(currentSearch)) ||
      (w.caption && w.caption.toLowerCase().includes(currentSearch));
    return catMatch && searchMatch;
  });

  if (currentSort === 'random') {
    if (randomOrderIds.length === 0) rebuildRandomOrder();
    const orderMap = new Map(randomOrderIds.map((id, i) => [id, i]));
    list.sort((a, b) => (orderMap.get(a.id) ?? 0) - (orderMap.get(b.id) ?? 0));
  } else if (currentSort === 'newest') {
    list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  } else if (currentSort === 'oldest') {
    list.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  } else if (currentSort === 'title') {
    list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ko'));
  }
  return list;
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  const label = document.getElementById('currentFilterLabel');
  const catLabel = CATEGORIES.find(c => c.id === currentCategory)?.label || '전체';
  const sortLabel = { random: '랜덤', newest: '최신순', oldest: '오래된순', title: '제목순' }[currentSort];
  label.textContent = `${catLabel} · ${sortLabel}`;

  filteredList = getFilteredWorks();

  if (WORKS.length === 0) {
    gallery.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <p>아직 업로드된 작업이 없습니다</p>
      </div>`;
    return;
  }
  if (filteredList.length === 0) {
    gallery.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <p>검색 결과가 없습니다</p>
      </div>`;
    return;
  }

  gallery.innerHTML = filteredList.map(w => {
    const cat = CATEGORIES.find(c => c.id === w.category);
    const color = cat?.color || 'var(--accent)';
    const catLabel = cat?.label || w.category;
    const newBadge = isNewWork(w.date) ? '<span class="new-badge">NEW</span>' : '';
    return `
      <article class="card" data-id="${w.id}" tabindex="0" role="button">
        <div class="card-img-wrap">
          ${newBadge}
          <div class="skeleton"></div>
          <img src="${w.img}" alt="${w.title}" loading="lazy" onload="this.classList.add('loaded')">
        </div>
        <div class="card-body">
          <div class="card-cat" style="color:${color}">
            <span class="card-cat-dot" style="background:${color}"></span>
            ${catLabel}${w.sub ? ' · ' + w.sub : ''}
          </div>
          <h3 class="card-title">${w.title}</h3>
          <div class="card-date">${w.date || ''}</div>
        </div>
      </article>`;
  }).join('');

  gallery.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openLightbox(+card.dataset.id));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightbox(+card.dataset.id);
      }
    });
  });
}

/* =====================================================
   라이트박스
===================================================== */
function openLightbox(id, fromUrl = false) {
  const work = WORKS.find(w => w.id === id);
  if (!work) return;
  currentWork = work;
  updateLightboxContent(work);
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
  updateUrlState({ workId: id, push: !fromUrl });
}

function updateLightboxContent(work) {
  const cat = CATEGORIES.find(c => c.id === work.category);
  document.getElementById('lightboxImg').src = work.img;
  document.getElementById('lightboxImg').alt = work.title;
  document.getElementById('lightboxTitle').textContent = work.title;
  document.getElementById('lightboxMeta').textContent =
    `${cat?.label || work.category}${work.sub ? ' · ' + work.sub : ''}  ·  ${work.date || ''}${work.caption ? '  ·  ' + work.caption : ''}`;
}

function navigateLightbox(direction) {
  if (!currentWork || filteredList.length === 0) return;
  const idx = filteredList.findIndex(w => w.id === currentWork.id);
  if (idx === -1) return;
  let nextIdx = idx + direction;
  if (nextIdx < 0) nextIdx = filteredList.length - 1;
  if (nextIdx >= filteredList.length) nextIdx = 0;
  currentWork = filteredList[nextIdx];
  updateLightboxContent(currentWork);
  updateUrlState({ workId: currentWork.id });
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
  currentWork = null;
  updateUrlState({ clearWork: true });
}

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxClose2').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('active')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigateLightbox(-1);
    if (e.key === 'ArrowRight') navigateLightbox(1);
  } else {
    if (e.key === 'Escape') {
      closeMenu();
      document.getElementById('iosSaveOverlay').classList.remove('active');
      document.getElementById('mobileSearchOverlay').classList.remove('active');
    }
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!currentWork) return;
  downloadImage(currentWork.img, `WEST150_${(currentWork.title || 'work').replace(/\s+/g, '_')}.png`);
});

document.getElementById('shareX').addEventListener('click', () => {
  if (!currentWork) return;
  const text = encodeURIComponent(`${currentWork.title} — WEST150 OFFICIAL`);
  const url = encodeURIComponent(getWorkShareUrl(currentWork.id));
  window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'noopener');
});

document.getElementById('shareThreads').addEventListener('click', () => {
  if (!currentWork) return;
  const text = encodeURIComponent(`${currentWork.title} — WEST150 OFFICIAL\n${getWorkShareUrl(currentWork.id)}`);
  window.open(`https://www.threads.net/intent/post?text=${text}`, '_blank', 'noopener');
});

document.getElementById('iosSaveClose').addEventListener('click', () => {
  document.getElementById('iosSaveOverlay').classList.remove('active');
});

/* =====================================================
   소셜
===================================================== */
function renderSocial() {
  const icons = {
    x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
    threads: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.313-8.184-3.817C2.35 18.033 1.5 15.047 1.5 11.99c0-3.058.85-6.044 2.495-8.193C5.845 1.293 8.598.004 12.18 0h.014c3.581.024 6.334 1.313 8.184 3.817C22.15 5.965 23 8.95 23 12.01c0 3.058-.85 6.044-2.495 8.193C18.655 22.707 15.902 23.996 12.186 24zm.014-21.5c-3.2.021-5.57 1.13-7.13 3.29C3.49 7.95 2.7 10.4 2.7 12.99c0 2.59.79 5.04 2.35 7.2 1.56 2.16 3.93 3.27 7.13 3.29h.014c3.2-.021 5.57-1.13 7.13-3.29 1.56-2.16 2.35-4.61 2.35-7.2 0-2.59-.79-5.04-2.35-7.2-1.56-2.16-3.93-3.27-7.13-3.29h-.014z"/><path d="M16.85 11.99c0-2.48-1.12-4.05-3.12-4.05-1.12 0-2.05.55-2.55 1.48V6.4h-2.2v10.98h2.2v-4.85c.5.93 1.43 1.48 2.55 1.48 2 0 3.12-1.57 3.12-4.05zm-2.2 0c0 1.28-.55 2.05-1.45 2.05s-1.45-.77-1.45-2.05.55-2.05 1.45-2.05 1.45.77 1.45 2.05z"/></svg>`,
    email: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`
  };
  document.getElementById('socialLinks').innerHTML = SOCIAL_LINKS.map(s => `
    <a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label}">${icons[s.platform] || s.label}</a>
  `).join('');
}
document.getElementById('year').textContent = new Date().getFullYear();

const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  backTop.classList.toggle('visible', window.scrollY > 400);
});
