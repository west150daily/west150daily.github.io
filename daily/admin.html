<body>

  <!-- =========================

  <div class="password-box" id="passwordBox">

    <h1>WEST150 DAILY</h1>

    <p class="subtitle">

<script>

/* =========================================================
   WEST150 DAILY ADMIN
   ========================================================= */


/* =========================
   비밀번호
========================= */

const ADMIN_PASSWORD = "101677";


/* =========================
   전역 변수
========================= */

let cards = [];

let editingId = null;


/* =========================
   페이지 로딩 후 실행
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const loginForm =
      document.getElementById("loginForm");

    const passwordInput =
      document.getElementById("passwordInput");

    const imageFiles =
      document.getElementById("imageFiles");


    /* 로그인 */

    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        checkPassword();

      }
    );


    /* 이미지 선택 */

    imageFiles.addEventListener(
      "change",
      handleImageSelection
    );

  }
);


/* =========================
   비밀번호 확인
========================= */

function checkPassword() {

  const input =
    document
      .getElementById("passwordInput")
      .value
      .trim();

  const error =
    document.getElementById("passwordError");


  if (input === ADMIN_PASSWORD) {

    error.textContent = "";

    document
      .getElementById("passwordBox")
      .style.display = "none";

    document
      .getElementById("adminContent")
      .style.display = "block";

    loadCards();

  } else {

    error.textContent =
      "비밀번호가 틀렸습니다.";

    document
      .getElementById("passwordInput")
      .value = "";

    document
      .getElementById("passwordInput")
      .focus();

  }

}


/* =========================
   이미지 선택 처리
========================= */

function handleImageSelection(event) {

  const files =
    Array.from(event.target.files);

  const textarea =
    document.getElementById("images");

  const selected =
    document.getElementById("selectedFiles");


  if (!files.length) {

    selected.innerHTML = "";

    return;

  }


  /*
    선택한 파일 이름을
    daily/image 기준 상대경로로 변환
  */

  const paths =
    files.map(function (file) {

      return "image/" + file.name;

    });


  /*
    기존 입력값이 있으면
    뒤에 추가하지 않고
    현재 선택 파일로 갱신
  */

  textarea.value =
    paths.join("\n");


  selected.innerHTML =
    paths.map(function (path) {

      return (
        "<div>✓ " +
        escapeHtml(path) +
        "</div>"
      );

    }).join("");

}


/* =========================
   HTML escape
========================= */

function escapeHtml(value) {

  return String(
    value == null ? "" : value
  )

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


/* =========================
   기존 data.json 불러오기
========================= */

async function loadCards() {

  try {

    const res =
      await fetch(
        "data.json?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!res.ok) {

      throw new Error(
        "data.json HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    cards =
      Array.isArray(data)
        ? data
        : [];


  } catch (error) {

    console.error(
      "data.json 로드 실패:",
      error
    );

    cards = [];

  }


  renderList();

}


/* =========================
   카드 목록 출력
========================= */

function renderList() {

  const list =
    document.getElementById(
      "cardList"
    );

  const count =
    document.getElementById(
      "cardCount"
    );


  count.textContent =
    "(" +
    cards.length +
    ")";


  if (cards.length === 0) {

    list.innerHTML =
      '<div class="empty">' +
      '등록된 카드가 없습니다' +
      '</div>';

    return;

  }


  const sorted =
    [...cards].sort(
      function (a, b) {

        return (
          new Date(b.time) -
          new Date(a.time)
        );

      }
    );


  list.innerHTML =
    sorted.map(function (card) {

      const text =
        String(card.text || "");


      return `

        <div class="list-item">

          <div class="list-text">

            <span class="list-cat">
              ${escapeHtml(card.category || "")}
            </span>

            ${
              card.breaking
                ? '<span style="color:#ff6b6b;font-size:0.75rem;">[속보]</span> '
                : ""
            }

            ${escapeHtml(
              text.slice(0, 80)
            )}

            ${
              text.length > 80
                ? "..."
                : ""
            }

          </div>


          <div class="list-actions">

            <button
              type="button"
              class="btn btn-secondary"
              style="
                padding:6px 10px;
                font-size:0.8rem;
              "
              onclick="editCard(${Number(card.id)})"
            >
              수정
            </button>


            <button
              type="button"
              class="btn btn-danger"
              style="
                padding:6px 10px;
                font-size:0.8rem;
              "
              onclick="deleteCard(${Number(card.id)})"
            >
              삭제
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   카드 추가
========================= */

function addCard() {

  const category =
    document
      .getElementById("category")
      .value;


  const text =
    document
      .getElementById("text")
      .value
      .trim();


  const source =
    document
      .getElementById("source")
      .value
      .trim()
      ||
      "출처";


  const sourceUrl =
    document
      .getElementById("sourceUrl")
      .value
      .trim()
      ||
      "#";


  const imagesRaw =
    document
      .getElementById("images")
      .value
      .trim();


  const images =
    imagesRaw
      ? imagesRaw
          .split(/\r?\n/)
          .map(function (s) {
            return s.trim();
          })
          .filter(Boolean)
      : [];


  const breaking =
    document
      .getElementById("breaking")
      .checked;


  if (!text) {

    alert(
      "내용을 입력해주세요."
    );

    return;

  }


  /* 수정 */

  if (editingId !== null) {

    const idx =
      cards.findIndex(
        function (c) {

          return (
            Number(c.id) ===
            Number(editingId)
          );

        }
      );


    if (idx !== -1) {

      cards[idx] = {

        ...cards[idx],

        category,

        text,

        source,

        sourceUrl,

        images,

        breaking

      };

    }


    editingId = null;


    clearForm();

    renderList();


    alert(
      "수정되었습니다."
    );


    return;

  }


  /* 새 카드 */

  const ids =
    cards
      .map(function (c) {
        return Number(c.id);
      })
      .filter(function (id) {
        return Number.isFinite(id);
      });


  const newId =
    ids.length
      ? Math.max(...ids) + 1
      : 1;


  cards.push({

    id: newId,

    category,

    time:
      new Date().toISOString(),

    text,

    source,

    sourceUrl,

    images,

    breaking

  });


  clearForm();

  renderList();


  alert(
    "카드가 추가되었습니다.\n\n" +
    "하단에서 JSON을 다운로드하세요."
  );

}


/* =========================
   카드 수정
========================= */

function editCard(id) {

  const card =
    cards.find(
      function (c) {

        return (
          Number(c.id) ===
          Number(id)
        );

      }
    );


  if (!card) {
    return;
  }


  editingId =
    Number(id);


  document
    .getElementById("category")
    .value =
    card.category || "정치";


  document
    .getElementById("text")
    .value =
    card.text || "";


  document
    .getElementById("source")
    .value =
    card.source || "";


  document
    .getElementById("sourceUrl")
    .value =
    card.sourceUrl || "";


  document
    .getElementById("images")
    .value =
    Array.isArray(card.images)
      ? card.images.join("\n")
      : "";


  document
    .getElementById("breaking")
    .checked =
    Boolean(card.breaking);


  document
    .getElementById("imageFiles")
    .value = "";


  document
    .getElementById("selectedFiles")
    .innerHTML =
    "";


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================
   카드 삭제
========================= */

function deleteCard(id) {

  if (
    !confirm(
      "이 카드를 삭제할까요?"
    )
  ) {

    return;

  }


  cards =
    cards.filter(
      function (c) {

        return (
          Number(c.id) !==
          Number(id)
        );

      }
    );


  renderList();

}


/* =========================
   폼 초기화
========================= */

function clearForm() {

  editingId = null;


  document
    .getElementById("text")
    .value = "";


  document
    .getElementById("source")
    .value = "";


  document
    .getElementById("sourceUrl")
    .value = "";


  document
    .getElementById("images")
    .value = "";


  document
    .getElementById("imageFiles")
    .value = "";


  document
    .getElementById("selectedFiles")
    .innerHTML = "";


  document
    .getElementById("breaking")
    .checked = false;

}


/* =========================
   JSON 다운로드
========================= */

function downloadJSON() {

  const dataStr =
    JSON.stringify(
      cards,
      null,
      2
    );


  const blob =
    new Blob(
      [dataStr],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;

  a.download =
    "data.json";


  document
    .body
    .appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    function () {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}

</script>

</body>
</html>
