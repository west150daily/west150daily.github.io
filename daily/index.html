<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEST150 DAILY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tooplate-2167-orbital-style.css">
<link rel="stylesheet" href="west150-daily-style.css">
</head>

<body class="page-sub page-daily">

<div class="aura"></div>
<div class="stars"></div>

<nav class="nav">
  <div class="logo">
    <a href="../" class="logo logo-img-badge">
      <img src="../images/west150-daily-logo.png" alt="WEST150 DAILY" class="logo-img">
    </a>
  </div>
  <div class="nav-clock" id="navClock">
    <span class="nav-clock__item">
      <span class="nav-clock__flag">🇰🇷</span>
      <span class="nav-clock__label">KST</span>
      <span id="clockKST">--:--</span>
    </span>
    <span class="nav-clock__item">
      <span class="nav-clock__flag">🇺🇸</span>
      <span class="nav-clock__label">EST</span>
      <span id="clockEST">--:--</span>
    </span>
  </div>
</nav>

<header class="daily-hero">
  <div class="daily-hero__badge reveal"><span class="dot"></span>LIVE FEED</div>
  <h1 class="reveal">WEST150 DAILY CARD NEWS</h1>
  <p class="reveal">다양한 소식을 선별해 읽기 쉬운 카드뉴스로 정리해 전합니다.</p>
</header>

<!-- 카테고리 필터 -->
<div class="category-filter reveal">
  <button class="cat-btn is-active" data-cat="all">전체</button>
  <button class="cat-btn" data-cat="정치">정치</button>
  <button class="cat-btn" data-cat="경제">경제</button>
  <button class="cat-btn" data-cat="테크">테크</button>
  <button class="cat-btn" data-cat="해외">해외</button>
  <button class="cat-btn" data-cat="사회">사회</button>
</div>

<div class="feed-notice reveal">
  <p>※ 최신 카드뉴스는 GitHub의 daily/data.json을 기준으로 표시됩니다.</p>
</div>

<div class="daily-layout">

  <!-- 속보 -->
  <aside class="breaking-sidebar reveal" id="breakingSidebar">
    <div class="breaking-sidebar__head">
      <span class="dot"></span>속보
      <span class="breaking-new-badge">NEW</span>
    </div>
    <div class="breaking-list">
      <a href="#card-1" class="breaking-item">
  <img class="breaking-item__thumb" src="../images/west150-daily-icon.png" alt="">
  <div class="breaking-item__content">
    <span class="breaking-item__time">방금</span>
    <span class="breaking-item__text">속보 예시 문구가 이 자리에 짧게 표시됩니다.</span>
  </div>
</a>
      <a href="#card-2" class="breaking-item">
        <span class="breaking-item__time">12분 전</span>
        <span class="breaking-item__text">속보만 모아서 빠르게 훑어볼 수 있는 공간입니다.</span>
      </a>
      <a href="#card-3" class="breaking-item">
        <span class="breaking-item__time">1시간 전</span>
        <span class="breaking-item__text">중요한 소식은 메인 피드보다 먼저 여기에 올라옵니다.</span>
      </a>
    </div>
  </aside>

  <section class="feed feed--in-layout" id="mainFeed">
    <div class="skeleton-card" id="feedLoading">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-lines">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line long"></div>
      </div>
    </div>
  </section>
</div>

<!-- 맨 위로 -->
<button class="back-to-top" id="backToTop" aria-label="맨 위로">↑</button>

    </a>

  <div class="footer-right">
