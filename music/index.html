<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEST150 MUSIC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

>

<link

>
</head>

<body class="page-music">

<div class="aura"></div>
<div class="stars"></div>


<!-- ================================
     NAV
================================ -->

<nav class="nav">
  <div class="logo">
    <a href="../" class="logo">
      <img
        src="../images/west150-logo.png"
        alt="WEST150"
        class="logo-img"
      >
    </a>
  </div>
</nav>


<!-- ================================
     HERO
================================ -->

<header class="music-hero">

  <img
    src="../images/west150-music-logo.png"
    alt="WEST150 MUSIC"
    class="music-hero__logo reveal"
  >

  <div class="music-hero__eyebrow reveal">
    WEST150 MUSIC
  </div>

  <h1 class="reveal">
    WEST150의 음악 아카이브
  </h1>

  <p class="reveal">
    일상 속 깊은 감정과 선명한 기억의 순간들을 사운드로 기록합니다.<br>
    아래의 앨범을 통해, 당신의 오늘과 닮은 트랙을 플레이해 보세요.
  </p>

</header>


<!-- ================================
     ALBUM GRID
================================ -->

<section class="section album-grid-section">

  <div
    class="album-grid"
    id="albumGrid"
  ></div>

</section>


<!-- ================================
     FOOTER
================================ -->

<footer class="footer">

    <a href="../" class="logo">

        alt="WEST150"

    </a>

  </div>


  <div class="footer-right">

    <div class="social-icons">

        href="https://x.com/WEST150OFFICIAL"

          stroke="currentColor"

        >
          <path d="M4 4L20 20M20 4L4 20"/>
        </svg>
      </a>


      <a
        href="#"
        class="social-icon"
        rel="noopener"
        target="_blank"
        aria-label="Threads"
      >
        <svg
          viewBox="0 0 16 16"
          fill="currentColor"
        >
          <path d="M6.321 6.016c-.27-.18-1.166-.802-1.166-.802.756-1.081 1.753-1.502 3.132-1.502.975 0 1.803.327 2.394.948s.928 1.509 1.005 2.644q.492.207.905.484c1.109.745 1.719 1.86 1.719 3.137 0 2.716-2.226 5.075-6.256 5.075C4.594 16 1 13.987 1 7.994 1 2.034 4.482 0 8.044 0 9.69 0 13.55.243 15 5.036l-1.36.353C12.516 1.974 10.163 1.43 8.006 1.43c-3.565 0-5.582 2.171-5.582 6.79 0 4.143 2.254 6.343 5.63 6.343 2.777 0 4.847-1.443 4.847-3.556 0-1.438-1.208-2.127-1.27-2.127-.236 1.234-.868 3.31-3.644 3.31-1.618 0-3.013-1.118-3.013-2.582 0-2.09 1.984-2.847 3.55-2.847.586 0 1.294.04 1.663.114 0-.637-.54-1.728-1.9-1.728-1.25 0-1.566.405-1.967.868ZM8.716 8.19c-2.04 0-2.304.87-2.304 1.416 0 .878 1.043 1.168 1.6 1.168 1.02 0 2.067-.282 2.232-2.423a6.2 6.2 0 0 0-1.528-.161"/>
        </svg>
      </a>


      <a
        href="#"
        class="social-icon"
        rel="noopener"
        target="_blank"
        aria-label="Instagram"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect
            x="3.5"
            y="3.5"
            width="17"
            height="17"
            rx="5"
          />
          <circle

            cy="12"
            r="4.2"
          />
          <circle
            cx="17.2"
            cy="6.8"

            fill="currentColor"
            stroke="none"
          />
        </svg>
      </a>


      <a

        class="social-icon"
        aria-label="Email"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="3"
            y="5.5"

            height="13"
            rx="2.5"

          <path d="M3.5 6.5L12 13L20.5 6.5"/>
        </svg>

    </div>

    <div class="credit">
      © 2026 WEST150. All rights reserved.
    </div>

  </div>

</footer>


<!-- ================================
     MINI PLAYER
================================ -->

<div
  class="mini-player"
  id="miniPlayer"
  aria-hidden="true"
>

  <img
    src="../images/every-cover.png"
    alt=""
    class="mini-player__cover"
    id="miniCover"
    draggable="false"
    oncontextmenu="return false"
  >


  <div class="mini-player__info">

    <div
      class="mini-player__title"
      id="miniTitle"
    >
      EVERY
    </div>

    <div
      class="mini-player__credit"
      id="miniCredit"
    >
      AI와 협업 제작
    </div>

  </div>


  <div class="mini-player__controls">

    <button
      class="mini-player__btn"
      id="miniPlayBtn"
      type="button"
      aria-label="재생/일시정지"
    >

      <svg
        class="icon-play"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M8 5.5v13l11-6.5L8 5.5z"/>
      </svg>

      <svg
        class="icon-pause"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <rect
          x="6"
          y="5"
          width="4"
          height="14"
          rx="1"
        />
        <rect
          x="14"
          y="5"
          width="4"
          height="14"
          rx="1"
        />
      </svg>

    </button>


    <button
      class="mini-player__open"
      id="miniOpenBtn"
      type="button"
      aria-label="전체 플레이어 열기"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <path d="M7 14l5-5 5 5"/>
      </svg>

    </button>

  </div>

</div>


<!-- ================================
     MUSIC MODAL
================================ -->

<div
  class="music-modal"
  id="musicModal"
  role="dialog"
  aria-modal="true"
  aria-label="WEST150 MUSIC"
>

  <div
    class="music-modal__backdrop"
    data-close-music
  ></div>


  <div class="music-modal__panel">


    <button
      class="music-modal__close"
      data-close-music
      aria-label="닫기"
    >
      &times;
    </button>


    <div class="music-modal__head">

      <img
        src="../images/west150-music-logo.png"
        alt="WEST150 MUSIC"
        class="music-modal__logo"
      >

      <h2>
        TRACKS
      </h2>


      <button
        class="music-modal__show-all"
        id="showAllAlbums"
        type="button"
        hidden
      >
        ← 전체 앨범
      </button>

    </div>


    <!-- Controls -->

    <div class="modal-controls">

      <button
        class="modal-ctrl-btn"
        id="playAllBtn"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="currentColor"
          width="14"
          height="14"
        >
          <path d="M8 5.5v13l11-6.5L8 5.5z"/>
        </svg>

        전체재생

      </button>


      <button
        class="modal-ctrl-btn"
        id="repeatBtn"
        type="button"
        aria-pressed="false"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="14"
          height="14"
        >
          <path d="M17 2l4 4-4 4"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 22l-4-4 4-4"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>

        반복재생

      </button>

    </div>


    <!-- Track list -->

    <div
      class="track-list"
      id="trackList"
    ></div>


    <!-- Now Playing -->

    <div
      class="now-playing"
      id="nowPlaying"
    >

      <img
        src="../images/every-cover.png"
        alt=""
        class="now-playing__cover"
        id="npCover"
        draggable="false"
        oncontextmenu="return false"
      >


      <div class="now-playing__info">

        <div
          class="now-playing__title"
          id="npTitle"
        >
          EVERY
        </div>


        <div
          class="now-playing__credit"
          id="npCredit"
        >
          AI와 협업 제작
        </div>


        <audio
          id="npAudio"
          controls
          preload="none"
          controlsList="nodownload noremoteplayback"
          disablePictureInPicture
          oncontextmenu="return false"
        ></audio>

      </div>

    </div>


    <!-- Lyrics -->

    <div
      class="lyrics-box"
      id="lyricsBox"
    >

      <div class="lyrics-box__label">
        LYRICS
      </div>


      <p
        class="lyrics-box__text"
        id="lyricsText"
      >
        가사를 불러오는 중입니다.
      </p>

    </div>


    <p class="music-disclaimer">
      본 페이지의 트랙은 상업적 이용이 아닌 포트폴리오 용도로 게시된 샘플입니다.
    </p>

  </div>

</div>


<!-- ================================
     기존 공통 JS
================================ -->

<script src="../tooplate-2167-orbital-script.js"></script>


<!-- ================================
     기존 가사 데이터
================================ -->

<script src="../lyrics-data.js"></script>


<!-- ================================
     JSON → HTML
================================ -->

<script>

(async function () {

  const grid =
    document.getElementById("albumGrid");

  const list =
    document.getElementById("trackList");


  function esc(value) {

    return String(
      value == null ? "" : value
    )
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  try {

    /*
     * music 폴더 안의 JSON
     */
    const response =
      await fetch(
        "music-data.json?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "music-data.json " +
        response.status
      );

    }


    const data =
      await response.json();


    const albums =
      Array.isArray(data.albums)
        ? data.albums
        : [];


    /*
     * 앨범 카드 생성
     */

    grid.innerHTML =
      albums.map(function (album) {

        return `

          <button
            class="album-card js-open-music"
            data-album-id="${esc(album.id)}"
            data-album-cover="${esc(album.cover)}"
            type="button"
          >

            <img
              src="${esc(album.cover)}"
              alt="${esc(album.title)} 앨범 커버"
              class="album-card__cover"
              draggable="false"
              oncontextmenu="return false"
            >

            <div class="album-card__title">
              ${esc(album.title)}
            </div>

            <div class="album-card__meta">
              ${esc(album.type || "ALBUM")}
              ·
              ${(album.tracks || []).length}
              TRACKS
            </div>

          </button>

        `;

      }).join("");


    /*
     * 트랙 목록 생성
     */

    list.innerHTML =
      albums.map(function (album) {

        const tracks =
          Array.isArray(album.tracks)
            ? album.tracks
            : [];


        return `

          <div
            class="album"
            data-album-id="${esc(album.id)}"
          >

            <div class="album-header">

              <img
                src="${esc(album.cover)}"
                alt="${esc(album.title)} 앨범 커버"
                class="album-cover"
                draggable="false"
                oncontextmenu="return false"
              >

              <div class="album-title">
                ${esc(album.title)}
              </div>

              <div class="album-meta">
                ${esc(album.type || "ALBUM")}
                ·
                ${tracks.length}
                TRACKS
              </div>

            </div>


            <div class="album-tracks">

              ${tracks.map(function (track, index) {

                const lyrics =
                  track.lyrics || "";


                const trackId =
                  track.lyricsId ||
                  track.id ||
                  "";


                return `

                  <button
                    class="track-item"
                    type="button"
                    data-src="${esc(track.audio)}"
                    data-cover="${esc(album.cover)}"
                    data-title="${esc(track.title)}"
                    data-track-id="${esc(trackId)}"
                    data-lyrics="${esc(lyrics)}"
                    data-credit-label="${esc(track.credit || "")}"
                  >

                    <span class="track-item__num">
                      ${String(index + 1).padStart(2, "0")}
                    </span>

                    <span class="track-item__title">
                      ${esc(track.title)}
                    </span>

                    <span class="track-item__credit">
                      ${esc(track.credit || "")}
                    </span>

                    <span class="track-item__play">
                      ▶
                    </span>

                  </button>

                `;

              }).join("")}

            </div>

          </div>

        `;

      }).join("");


    /*
     * 첫 번째 곡 기본값
     */

    if (
      albums[0] &&
      Array.isArray(albums[0].tracks) &&
      albums[0].tracks[0]
    ) {

      const firstAlbum =
        albums[0];

      const firstTrack =
        firstAlbum.tracks[0];


      const audio =
        document.getElementById(
          "npAudio"
        );

      const cover =
        document.getElementById(
          "npCover"
        );

      const title =
        document.getElementById(
          "npTitle"
        );

      const credit =
        document.getElementById(
          "npCredit"
        );

      const lyrics =
        document.getElementById(
          "lyricsText"
        );


      if (audio) {

        audio.src =
          firstTrack.audio || "";

      }


      if (cover) {

        cover.src =
          firstAlbum.cover || "";

      }


      if (title) {

        title.textContent =
          firstTrack.title || "";

      }


      if (credit) {

        credit.textContent =
          firstTrack.credit || "";

      }


      const firstTrackId =
        firstTrack.lyricsId ||
        firstTrack.id;


      const firstLyrics =
        (
          typeof LYRICS !== "undefined" &&
          firstTrackId &&
          LYRICS[firstTrackId]
        ) ||
        firstTrack.lyrics ||
        "";


      if (
        lyrics &&
        firstLyrics
      ) {

        lyrics.textContent =
          firstLyrics;

      }

    }


    /*
     * 중요:
     *
     * west150-music.js는
     * music 폴더 안에 있음.
     *
     * 따라서 ../west150-music.js가 아니라
     * ./west150-music.js
     */

    const playerScript =
      document.createElement("script");


    playerScript.src =
      "west150-music.js?t=" +
      Date.now();


    document.body.appendChild(
      playerScript
    );


  } catch (error) {

    console.error(
      "WEST150 MUSIC data load error:",
      error
    );


    if (grid) {

      grid.innerHTML = `

        <p style="opacity:.6">
          music-data.json을 불러오지 못했습니다.
        </p>

      `;

    }

  }

})();

</script>


</body>
</html>
