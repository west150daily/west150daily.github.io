<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEST150 MUSIC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../tooplate-2167-orbital-style.css">
</head>

<body class="page-music">

<div class="aura"></div>
<div class="stars"></div>

<nav class="nav">
  <div class="logo">
    <a href="../" class="logo">
      <img src="../images/west150-logo.png" alt="WEST150" class="logo-img">
    </a>
  </div>
</nav>

<header class="music-hero">

  <img
    src="../images/west150-music-logo.png"
    alt="WEST150 MUSIC"
    class="music-hero__logo reveal"
  >

  <div class="music-hero__eyebrow reveal">
    WEST150 MUSIC
  </div>

  <h1 class="reveal">
    WEST150의 음악 아카이브
  </h1>

  <p class="reveal">
    일상 속 깊은 감정과 선명한 기억의 순간들을 사운드로 기록합니다.<br>
    아래의 앨범을 통해, 당신의 오늘과 닮은 트랙을 플레이해 보세요.
  </p>

</header>

<section class="section album-grid-section">
  <div class="album-grid" id="albumGrid"></div>
</section>

<footer class="footer">

  <div class="logo">
    <a href="../" class="logo">
      <img
        src="../images/west150-logo.png"
        alt="WEST150"
        class="logo-img"
      >
    </a>
  </div>

  <div class="footer-right">

    <div class="social-icons">

      <a
        href="https://x.com/WEST150OFFICIAL"
        class="social-icon"
        rel="noopener"
        target="_blank"
        aria-label="X (Twitter)"
      >
        𝕏
      </a>

      <a
        href="#"
        class="social-icon"
        aria-label="Threads"
      >
        ◉
      </a>

      <a
        href="#"
        class="social-icon"
        aria-label="Instagram"
      >
        ◎
      </a>

      <a
        href="mailto:west150official@gmail.com"
        class="social-icon"
        aria-label="Email"
      >
        ✉
      </a>

    </div>

    <div class="credit">
      © 2026 WEST150. All rights reserved.
    </div>

  </div>

</footer>


<div
  class="mini-player"
  id="miniPlayer"
  aria-hidden="true"
>

  <img
    src="../images/every-cover.png"
    alt=""
    class="mini-player__cover"
    id="miniCover"
    draggable="false"
    oncontextmenu="return false"
  >

  <div class="mini-player__info">

    <div
      class="mini-player__title"
      id="miniTitle"
    >
      EVERY
    </div>

    <div
      class="mini-player__credit"
      id="miniCredit"
    >
      AI와 협업 제작
    </div>

  </div>

  <div class="mini-player__controls">

    <button
      class="mini-player__btn"
      id="miniPlayBtn"
      type="button"
      aria-label="재생/일시정지"
    >

      <svg
        class="icon-play"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M8 5.5v13l11-6.5L8 5.5z"/>
      </svg>

      <svg
        class="icon-pause"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <rect x="6" y="5" width="4" height="14" rx="1"/>
        <rect x="14" y="5" width="4" height="14" rx="1"/>
      </svg>

    </button>

    <button
      class="mini-player__open"
      id="miniOpenBtn"
      type="button"
      aria-label="전체 플레이어 열기"
    >
      ⌃
    </button>

  </div>

</div>


<div
  class="music-modal"
  id="musicModal"
  role="dialog"
  aria-modal="true"
  aria-label="WEST150 MUSIC"
>

  <div
    class="music-modal__backdrop"
    data-close-music
  ></div>

  <div class="music-modal__panel">

    <button
      class="music-modal__close"
      data-close-music
      aria-label="닫기"
    >
      &times;
    </button>

    <div class="music-modal__head">

      <img
        src="../images/west150-music-logo.png"
        alt="WEST150 MUSIC"
        class="music-modal__logo"
      >

      <h2>TRACKS</h2>

      <button
        class="music-modal__show-all"
        id="showAllAlbums"
        type="button"
        hidden
      >
        ← 전체 앨범
      </button>

    </div>

    <div class="modal-controls">

      <button
        class="modal-ctrl-btn"
        id="playAllBtn"
        type="button"
      >
        ▶ 전체재생
      </button>

      <button
        class="modal-ctrl-btn"
        id="repeatBtn"
        type="button"
        aria-pressed="false"
      >
        ↻ 반복재생
      </button>

    </div>

    <div
      class="track-list"
      id="trackList"
    ></div>


    <div
      class="now-playing"
      id="nowPlaying"
    >

      <img
        src="../images/every-cover.png"
        alt=""
        class="now-playing__cover"
        id="npCover"
        draggable="false"
        oncontextmenu="return false"
      >

      <div class="now-playing__info">

        <div
          class="now-playing__title"
          id="npTitle"
        >
          EVERY
        </div>

        <div
          class="now-playing__credit"
          id="npCredit"
        >
          AI와 협업 제작
        </div>

        <audio
          id="npAudio"
          controls
          preload="none"
          controlsList="nodownload noremoteplayback"
          disablePictureInPicture
          oncontextmenu="return false"
        ></audio>

      </div>

    </div>


    <div
      class="lyrics-box"
      id="lyricsBox"
    >

      <div class="lyrics-box__label">
        LYRICS
      </div>

      <p
        class="lyrics-box__text"
        id="lyricsText"
      >
        가사를 불러오는 중입니다.
      </p>

    </div>


    <p class="music-disclaimer">
      본 페이지의 트랙은 상업적 이용이 아닌 포트폴리오 용도로 게시된 샘플입니다.
    </p>

  </div>

</div>


<script src="../tooplate-2167-orbital-script.js"></script>

<script src="../lyrics-data.js"></script>

<script src="../west150-music.js"></script>


<script>

(async function(){

  const res =
    await fetch(
      "music-data.json?t=" + Date.now(),
      {
        cache:"no-store"
      }
    );

  if(!res.ok){

    throw new Error(
      "music-data.json " + res.status
    );

  }

  const data =
    await res.json();

  const grid =
    document.getElementById("albumGrid");

  const list =
    document.getElementById("trackList");


  const esc =
    v =>
      String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");


  grid.innerHTML =
    (data.albums || [])
      .map(a => `

        <button
          class="album-card reveal js-open-music"
          data-album-id="${esc(a.id)}"
          data-album-cover="${esc(a.cover)}"
        >

          <img
            src="${esc(a.cover)}"
            alt="${esc(a.title)} 앨범 커버"
            class="album-card__cover"
            draggable="false"
            oncontextmenu="return false"
          >

          <div class="album-card__title">
            ${esc(a.title)}
          </div>

          <div class="album-card__meta">
            ${esc(a.type || "ALBUM")}
            ·
            ${(a.tracks || []).length}
            TRACKS
          </div>

        </button>

      `)
      .join("");


  list.innerHTML =
    (data.albums || [])
      .map(a => `

        <div
          class="album"
          data-album-id="${esc(a.id)}"
        >

          <div class="album-header">

            <img
              src="${esc(a.cover)}"
              alt="${esc(a.title)} 앨범 커버"
              class="album-cover"
              draggable="false"
              oncontextmenu="return false"
            >

            <div class="album-title">
              ${esc(a.title)}
            </div>

            <div class="album-meta">
              ${esc(a.type || "ALBUM")}
              ·
              ${(a.tracks || []).length}
              TRACKS
            </div>

          </div>


          <div class="album-tracks">

            ${(a.tracks || [])
              .map((t,i) => `

                <button
                  class="track-item"
                  data-src="${esc(t.audio)}"
                  data-cover="${esc(a.cover)}"
                  data-title="${esc(t.title)}"
                  data-track-id="${esc(t.lyricsId || t.id)}"
                  data-lyrics="${t.lyrics ? esc(t.lyrics) : ""}"
                  data-credit-label="${esc(t.credit || "")}"
                >

                  <span class="track-item__num">
                    ${String(i+1).padStart(2,"0")}
                  </span>

                  <span class="track-item__title">
                    ${esc(t.title)}
                  </span>

                  <span class="track-item__credit">
                    ${esc(t.credit || "")}
                  </span>

                  <span class="track-item__play">
                    ▶
                  </span>

                </button>

              `)
              .join("")}

          </div>

        </div>

      `)
      .join("");


  const first =
    data.albums?.[0]?.tracks?.[0];


  if(first){

    document.getElementById("npAudio").src =
      first.audio;

    document.getElementById("npCover").src =
      data.albums[0].cover;

    document.getElementById("npTitle").textContent =
      first.title;

    document.getElementById("npCredit").textContent =
      first.credit || "";

  }


  if(window.WEST150MusicInit){

    window.WEST150MusicInit();

  }else{

    location.reload();

  }

})()

.catch(e => {

  console.error(e);

  document.getElementById("albumGrid").innerHTML =
    '<p style="opacity:.6">music-data.json을 불러오지 못했습니다.</p>';

});

</script>

</body>
</html>
