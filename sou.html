<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>WEST150.DAILY 출처·링크 모음 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --accent:#FF8228;--bg:#000;--panel:#1C1C1E;--input:#2C2C2E;--border:rgba(255,255,255,.08);
  --text:#F5F5F7;--muted:#8E8E93;--danger:#ff8a8a;--warn:#ffb74d;--radius:14px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
body.light{--bg:#F5F5F7;--panel:#fff;--input:#F2F2F7;--border:rgba(0,0,0,.06);--text:#1D1D1F;--muted:#6E6E73;--shadow:0 8px 32px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;letter-spacing:-.015em}
input,select,textarea,button{font-family:inherit;font-size:16px!important}
button{cursor:pointer;border:none;color:inherit}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;min-height:100vh}
@media(max-width:960px){.app{grid-template-columns:1fr}.side{position:static!important;height:auto!important;max-height:none!important;border-right:none;border-bottom:1px solid var(--border)}}
.side{background:var(--panel);border-right:1px solid var(--border);padding:24px 18px 48px;overflow-y:auto;position:sticky;top:0;height:100vh;max-height:100vh}
.side h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
.side .sub{font-size:12px;color:var(--muted);margin:4px 0 14px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.color-chip{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);padding:2px;background:var(--input)}
.icon-btn{flex:1;height:40px;border-radius:10px;background:var(--input);border:1px solid var(--border);font-size:13px;font-weight:600}
.sec{background:var(--input);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.sec-head .chev{font-size:11px;opacity:.5;transition:.2s;color:var(--muted)}
.sec.collapsed .sec-body{display:none}.sec.collapsed .chev{transform:rotate(-90deg)}
.sec-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-grid .full{grid-column:1/-1}
label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
label.field input,label.field select,label.field textarea{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;width:100%;outline:none}
label.field input:focus,label.field select:focus,label.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
label.field input[type=color]{height:38px;padding:3px}
label.field input[type=range]{-webkit-appearance:none;height:4px;background:var(--panel);border-radius:2px;border:none;width:100%;padding:0}
label.field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.item.dragging{opacity:.5}
.item.drag-over{border-color:var(--accent)}
.item-top{display:flex;align-items:center;gap:8px}
.item-top .num{color:var(--accent);font-weight:800;min-width:22px}
.item-top .drag{color:var(--muted);font-size:14px;cursor:grab;padding:0 4px}
.item-ctrls{display:flex;gap:4px;margin-left:auto}
.item-ctrls button{background:var(--input);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 7px;font-size:11px;min-height:28px}
.item.warn-url input[id^="u-"]{border-color:var(--warn)}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.tpl button{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;min-height:32px}
.tpl button:hover{border-color:var(--accent);color:var(--accent)}
.banner{display:none;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.45;margin-top:4px}
.banner.show{display:block}
.banner.warn{background:rgba(255,183,77,.12);border:1px solid rgba(255,183,77,.35);color:var(--warn)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn-p{background:var(--accent);color:#000;border-radius:12px;padding:14px;font-weight:800;width:100%}
.btn-s{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px;font-weight:600;width:100%}
.btn-d{background:transparent;border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);color:var(--danger);border-radius:12px;padding:12px;font-weight:600;width:100%}
.main{padding:28px 32px 100px;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
.plabel{font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start;margin-bottom:12px;letter-spacing:.04em}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;margin-bottom:14px}
.pill{background:var(--panel);border:1px solid var(--border);border-radius:980px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent)}
.canvas-wrap{position:sticky;top:28px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);max-width:100%;width:min(100%,480px)}
canvas{display:block;width:100%;height:auto;background:#0c0c0e}
#qrHost{position:absolute;left:-9999px;top:0;width:256px;height:256px}
.ios-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10000;flex-direction:column;align-items:center;justify-content:center;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.ios-overlay.show{display:flex}
.ios-overlay img{max-width:100%;max-height:68vh;border-radius:12px}
.ios-overlay p{color:#fff;margin:16px 0 8px;font-size:15px;font-weight:600;text-align:center;line-height:1.5}
.ios-overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.ios-overlay button{border-radius:980px;padding:12px 20px;font-weight:700}
@media(max-width:767px){.main{padding:16px 14px max(80px,env(safe-area-inset-bottom)+60px)}.sec-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="iosOverlay" class="ios-overlay">
  <p id="iosMsg">이미지를 <b>길게 누른 뒤</b><br>「사진에 추가 / 이미지 저장」을 선택하세요</p>
  <img id="iosImg" alt="저장할 카드">
  <div class="row">
    <button class="btn-s" style="width:auto;background:#2c2c2e;color:#fff" id="iosShareBtn">공유하기</button>
    <button class="btn-p" style="width:auto" id="iosCloseBtn">저장 완료 · 닫기</button>
  </div>
</div>

<div class="app">
<aside class="side">
  <h1>📎 출처·링크 모음</h1>
  <p class="sub">V1.3 · 글자 크기 · 카드 색상</p>
  <div class="tools">
    <input type="color" id="accent" class="color-chip" value="#FF8228" oninput="setAccent(this.value);render()">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
  </div>

  <div class="sec">
    <div class="sec-head" onclick="this.parentElement.classList.toggle('collapsed')"><span>기본</span><span class="chev">▼</span></div>
    <div class="sec-body">
      <div class="sec-grid">
        <label class="field full">사이즈
          <select id="size" onchange="render()">
            <option value="1080x1350">세로 4:5 (1080×1350)</option>
            <option value="1080x1080">정사각 1:1</option>
            <option value="1080x1920">스토리 9:16</option>
            <option value="1600x900">와이드 16:9</option>
          </select>
        </label>
        <label class="field full">레이아웃
          <select id="layout" onchange="render()">
            <option value="list">세로 리스트</option>
            <option value="cards">박스 카드</option>
            <option value="compact">컴팩트</option>
            <option value="qrfocus">QR 강조형</option>
          </select>
        </label>
        <label class="field full">카드 배경 색상
          <select id="cardTheme" onchange="render()">
            <option value="dark">다크 블랙</option>
            <option value="charcoal">차콜 그레이</option>
            <option value="navy">네이비</option>
            <option value="slate">슬레이트</option>
            <option value="forest">포레스트</option>
            <option value="wine">와인</option>
            <option value="indigo">인디고</option>
            <option value="light">라이트</option>
          </select>
        </label>
        <label class="field">시리즈 라벨<input id="series" value="SOURCES" oninput="render()"></label>
        <label class="field">날짜<input id="dateStr" placeholder="자동" oninput="render()"></label>
        <label class="field full">연결 제목<input id="title" value="세우타 여행경보 관련 확인 자료" oninput="render()"></label>
        <label class="field full">부제<input id="subtitle" value="" placeholder="팩트체크 후속 · 1차 자료" oninput="render()"></label>
      </div>
      <label class="chk"><input type="checkbox" id="showVerdict" onchange="render()"> 판정 뱃지 표시</label>
      <div class="sec-grid">
        <label class="field">판정
          <select id="verdict" onchange="onVerdict();render()">
            <option value="exaggerated">과장됨</option>
            <option value="false">거짓</option>
            <option value="true">사실</option>
            <option value="misleading">오해의 소지</option>
            <option value="fabricated">조작됨</option>
            <option value="partial">부분적 사실</option>
            <option value="custom">직접 입력</option>
          </select>
        </label>
        <label class="field">판정 문구<input id="verdictText" value="과장됨" oninput="render()"></label>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head" onclick="this.parentElement.classList.toggle('collapsed')"><span>글자 크기</span><span class="chev">▼</span></div>
    <div class="sec-body">
      <label class="field">제목 크기 <span id="fsTitleVal">36</span>px
        <input type="range" id="fsTitle" min="24" max="56" value="36" oninput="$('fsTitleVal').textContent=this.value;render()">
      </label>
      <label class="field">본문(항목 제목) 크기 <span id="fsBodyVal">24</span>px
        <input type="range" id="fsBody" min="16" max="40" value="24" oninput="$('fsBodyVal').textContent=this.value;render()">
      </label>
      <label class="field">설명 크기 <span id="fsDescVal">15</span>px
        <input type="range" id="fsDesc" min="12" max="28" value="15" oninput="$('fsDescVal').textContent=this.value;render()">
      </label>
      <label class="field">링크(URL) 크기 <span id="fsLinkVal">13</span>px
        <input type="range" id="fsLink" min="10" max="24" value="13" oninput="$('fsLinkVal').textContent=this.value;render()">
      </label>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head" onclick="this.parentElement.classList.toggle('collapsed')"><span>브랜드 · 하단</span><span class="chev">▼</span></div>
    <div class="sec-body">
      <label class="field">브랜드<input id="brand" value="WEST150.DAILY" oninput="render()"></label>
      <label class="field">워터마크<input id="wm" value="@west150daily" oninput="render()"></label>
      <label class="field">CTA<input id="cta" value="더 읽어보기 · 1차 자료 확인" oninput="render()"></label>
      <label class="field">하단 출처<input id="footer" value="" placeholder="예: 확인일 2026.3.5" oninput="render()"></label>
      <label class="field">글꼴
        <select id="fontFamily" onchange="render()">
          <option value="Pretendard">Pretendard</option>
          <option value="Noto Sans KR">Noto Sans KR</option>
          <option value="Noto Serif KR">Noto Serif KR</option>
        </select>
      </label>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head" onclick="this.parentElement.classList.toggle('collapsed')"><span>표시 옵션</span><span class="chev">▼</span></div>
    <div class="sec-body">
      <label class="chk"><input type="checkbox" id="showUrl" checked onchange="render()"> 카드에 URL 표시</label>
      <label class="chk"><input type="checkbox" id="showType" checked onchange="render()"> 유형 태그</label>
      <label class="chk"><input type="checkbox" id="showDesc" checked onchange="render()"> 설명</label>
      <label class="chk"><input type="checkbox" id="showNum" checked onchange="render()"> 번호</label>
      <label class="chk"><input type="checkbox" id="showQr" onchange="render()"> QR 코드</label>
      <label class="field">QR 대상
        <select id="qrMode" onchange="render()">
          <option value="first">첫 유효 URL</option>
          <option value="custom">직접 입력</option>
        </select>
      </label>
      <label class="field">QR URL<input id="qrCustom" value="" placeholder="https://..." oninput="render()"></label>
      <label class="field">페이지당 항목
        <select id="perPage" onchange="pageIndex=0;render()">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="99">전부 한 페이지</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="footerLastOnly" checked onchange="render()"> CTA·워터마크 마지막 페이지만</label>
      <label class="chk"><input type="checkbox" id="safeGuide" onchange="render()"> 안전 영역 가이드</label>
      <label class="field">프레임
        <select id="frame" onchange="render()">
          <option value="none">없음</option>
          <option value="thin">얇은 단선</option>
          <option value="thick">두꺼운 단선</option>
        </select>
      </label>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head" onclick="this.parentElement.classList.toggle('collapsed')"><span>출처 항목</span><span class="chev">▼</span></div>
    <div class="sec-body">
      <div class="tpl">
        <button type="button" onclick="addTemplate('official')">+ 공식</button>
        <button type="button" onclick="addTemplate('press')">+ 언론</button>
        <button type="button" onclick="addTemplate('stats')">+ 통계</button>
        <button type="button" onclick="addTemplate('law')">+ 법령</button>
        <button type="button" onclick="addTemplate('empty')">+ 빈 항목</button>
      </div>
      <div id="overflowBanner" class="banner warn"></div>
      <div id="urlBanner" class="banner warn"></div>
      <div id="itemsWrap"></div>
      <label class="field">일괄 붙여넣기
        <textarea id="bulkPaste" rows="4" placeholder="한 줄에 하나: 제목 | 설명 | URL&#10;또는 URL만&#10;빈 줄로 구분"></textarea>
      </label>
      <button type="button" class="btn-s" onclick="applyBulkPaste()">붙여넣기 → 항목 추가</button>
      <p style="font-size:11px;color:var(--muted);line-height:1.4">드래그로 순서 변경 · 제목 <b>**강조**</b></p>
    </div>
  </div>

  <div class="actions">
    <button class="btn-p" onclick="saveCurrent()">이 페이지 PNG 저장</button>
    <button class="btn-s" onclick="saveAllPages()">전체 페이지 저장 / ZIP</button>
    <button class="btn-s" onclick="copyCaption()">캡션용 링크 복사</button>
    <button class="btn-s" onclick="exportJSON()">JSON 백업</button>
    <button class="btn-s" onclick="$('importFile').click()">JSON 불러오기</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importJSON(event)">
    <button class="btn-d" onclick="resetAll()">초기화</button>
  </div>
</aside>

<main class="main">
  <p class="plabel">실시간 미리보기</p>
  <div class="pills" id="pagePills"></div>
  <div class="canvas-wrap"><canvas id="cv" width="1080" height="1350"></canvas></div>
</main>
</div>
<div id="qrHost"></div>

<script>
const VERDICTS={
  true:{t:'사실',c:'#3DDC84'},false:{t:'거짓',c:'#FF4D4F'},exaggerated:{t:'과장됨',c:'#FF8228'},
  misleading:{t:'오해의 소지',c:'#F5C518'},fabricated:{t:'조작됨',c:'#B983FF'},partial:{t:'부분적 사실',c:'#5B8DEF'},custom:{t:'',c:null}
};
const TYPES={official:'공식',press:'언론',stats:'통계',law:'법령',other:'기타'};
const STORAGE='west150_sources_v1';
const CIRCLED='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

const CARD_THEMES={
  dark:{bg:'#0C0C0E',text:'#FFFFFF',muted:'rgba(255,255,255,.55)',faint:'rgba(255,255,255,.35)',soft:'rgba(255,255,255,.45)',line:'rgba(255,255,255,.1)',card:'rgba(255,255,255,.06)',cardBorder:'rgba(255,255,255,.1)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#0C0C0E',frame:'rgba(255,255,255,.35)',compact:'#EEEEEE'},
  charcoal:{bg:'#1A1A1C',text:'#F2F2F2',muted:'rgba(255,255,255,.55)',faint:'rgba(255,255,255,.35)',soft:'rgba(255,255,255,.45)',line:'rgba(255,255,255,.12)',card:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.12)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#1A1A1C',frame:'rgba(255,255,255,.35)',compact:'#EEEEEE'},
  navy:{bg:'#0B1220',text:'#F0F4FA',muted:'rgba(220,230,245,.55)',faint:'rgba(220,230,245,.35)',soft:'rgba(220,230,245,.45)',line:'rgba(255,255,255,.12)',card:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.12)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#0B1220',frame:'rgba(255,255,255,.35)',compact:'#E8EEF8'},
  slate:{bg:'#14181F',text:'#F1F3F7',muted:'rgba(230,235,245,.55)',faint:'rgba(230,235,245,.35)',soft:'rgba(230,235,245,.45)',line:'rgba(255,255,255,.12)',card:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.12)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#14181F',frame:'rgba(255,255,255,.35)',compact:'#ECEFF4'},
  forest:{bg:'#0C1410',text:'#EEF6F0',muted:'rgba(220,240,225,.55)',faint:'rgba(220,240,225,.35)',soft:'rgba(220,240,225,.45)',line:'rgba(255,255,255,.12)',card:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.12)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#0C1410',frame:'rgba(255,255,255,.35)',compact:'#E8F2EA'},
  wine:{bg:'#1A0E12',text:'#F8F0F2',muted:'rgba(245,220,230,.55)',faint:'rgba(245,220,230,.35)',soft:'rgba(245,220,230,.45)',line:'rgba(255,255,255,.12)',card:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.12)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#1A0E12',frame:'rgba(255,255,255,.35)',compact:'#F5E8EC'},
  indigo:{bg:'#12102A',text:'#F2F0FA',muted:'rgba(230,225,250,.55)',faint:'rgba(230,225,250,.35)',soft:'rgba(230,225,250,.45)',line:'rgba(255,255,255,.12)',card:'rgba(255,255,255,.07)',cardBorder:'rgba(255,255,255,.12)',wmBg:'rgba(255,255,255,.1)',verdictFg:'#12102A',frame:'rgba(255,255,255,.35)',compact:'#ECEAF8'},

};

let items=[];
let pageIndex=0;
let qrDataUrl=null;
let appReady=false;
let lastOverflowCount=0;
let currentTheme=CARD_THEMES.dark;

const $=id=>document.getElementById(id);
function setAccent(c){document.documentElement.style.setProperty('--accent',c)}
function toggleTheme(){
  const next=document.body.classList.contains('light')?'dark':'light';
  document.body.classList.toggle('light',next==='light');
  $('themeBtn').textContent=next==='light'?'🌙 다크':'☀️ 라이트';
  localStorage.setItem('west150_sources_theme',next);
}
function initTheme(){
  const t=localStorage.getItem('west150_sources_theme')||'dark';
  document.body.classList.toggle('light',t==='light');
  $('themeBtn').textContent=t==='light'?'🌙 다크':'☀️ 라이트';
}
function getCardTheme(){
  const key=$('cardTheme')?$('cardTheme').value:'dark';
  return CARD_THEMES[key]||CARD_THEMES.dark;
}
function typeGap(typeSize,bodySz,scale){
  return typeSize*1.35+Math.max(8*scale,bodySz*0.75);
}
function onVerdict(){
  const k=$('verdict').value;
  if(k!=='custom'&&VERDICTS[k]) $('verdictText').value=VERDICTS[k].t;
}
function todayStr(){const n=new Date();return `${n.getFullYear()}.${n.getMonth()+1}.${n.getDate()}`}
function fontStack(size,w){return `${w} ${size}px '${$('fontFamily').value}', Pretendard, 'Noto Sans KR', sans-serif`}
function parseSize(){const [w,h]=$('size').value.split('x').map(Number);return{W:w,H:h}}
function accentColor(){
  if($('showVerdict').checked){const k=$('verdict').value;if(k!=='custom'&&VERDICTS[k]) return VERDICTS[k].c}
  return $('accent').value;
}
function isValidUrl(s){
  const t=(s||'').trim();
  if(!t||t==='https://'||t==='http://') return false;
  try{const u=new URL(t);return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}
}
function firstValidUrl(){
  const it=items.find(i=>isValidUrl(i.url));
  return it?it.url.trim():'';
}
function fsTitle(){return Number($('fsTitle').value)||36}
function fsBody(){return Number($('fsBody').value)||24}
function fsDesc(){return Number($('fsDesc').value)||15}
function fsLink(){return Number($('fsLink').value)||13}
function syncFsLabels(){
  $('fsTitleVal').textContent=fsTitle();
  $('fsBodyVal').textContent=fsBody();
  $('fsDescVal').textContent=fsDesc();
  $('fsLinkVal').textContent=fsLink();
}

function addItem(pre={}){
  items.push({id:Date.now()+Math.random(),title:pre.title||'',desc:pre.desc||'',url:pre.url||'',type:pre.type||'official'});
  rebuildItems();render();save();
}
function addTemplate(kind){
  const map={
    official:{title:'**공식 문서**',desc:'기관명 · 문서 제목',url:'https://',type:'official'},
    press:{title:'**언론 기사**',desc:'매체명 · 기사 제목',url:'https://',type:'press'},
    stats:{title:'**통계 자료**',desc:'통계청/조사기관',url:'https://',type:'stats'},
    law:{title:'**법령·판례**',desc:'법제처 / 판결문',url:'https://',type:'law'},
    empty:{title:'',desc:'',url:'',type:'other'}
  };
  addItem(map[kind]||map.empty);
}
function removeItem(id){items=items.filter(i=>i.id!==id);rebuildItems();render();save()}
function moveItem(id,dir){
  const idx=items.findIndex(i=>i.id===id);const t=idx+dir;
  if(t<0||t>=items.length) return;
  [items[idx],items[t]]=[items[t],items[idx]];
  rebuildItems();render();save();
}
function syncItemsFromDOM(){
  items.forEach(it=>{
    const t=$(`t-${it.id}`),d=$(`d-${it.id}`),u=$(`u-${it.id}`),ty=$(`ty-${it.id}`);
    if(t) it.title=t.value; if(d) it.desc=d.value; if(u) it.url=u.value; if(ty) it.type=ty.value;
  });
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function rebuildItems(){
  const wrap=$('itemsWrap');wrap.innerHTML='';
  items.forEach((it,idx)=>{
    const badUrl=it.url&&it.url.trim()&&!isValidUrl(it.url);
    const div=document.createElement('div');
    div.className='item'+(badUrl?' warn-url':'');
    div.draggable=true;
    div.dataset.id=String(it.id);
    div.innerHTML=`
      <div class="item-top">
        <span class="drag" title="드래그">⠿</span>
        <span class="num">${CIRCLED[idx]||(idx+1)}</span>
        <div class="item-ctrls">
          <button type="button" onclick="moveItem(${it.id},-1)">▲</button>
          <button type="button" onclick="moveItem(${it.id},1)">▼</button>
          <button type="button" onclick="removeItem(${it.id})">✕</button>
        </div>
      </div>
      <input type="text" id="t-${it.id}" placeholder="제목 (**강조**)" value="${esc(it.title)}" oninput="onItemEdit()">
      <input type="text" id="d-${it.id}" placeholder="한 줄 설명" value="${esc(it.desc)}" oninput="onItemEdit()">
      <input type="text" id="u-${it.id}" placeholder="https://..." value="${esc(it.url)}" oninput="onItemEdit()">
      <select id="ty-${it.id}" onchange="onItemEdit()">
        ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${it.type===k?'selected':''}>${v}</option>`).join('')}
      </select>
      ${badUrl?'<span style="font-size:11px;color:var(--warn)">URL 형식을 확인해 주세요</span>':''}`;
    wrap.appendChild(div);
    bindDrag(div);
  });
  updateUrlBanner();
}
function onItemEdit(){syncItemsFromDOM();rebuildItemsSoft();render();saveDebounced()}
function rebuildItemsSoft(){
  updateUrlBanner();
  items.forEach(it=>{
    const box=$(`u-${it.id}`)?.closest('.item');
    if(!box) return;
    const bad=it.url&&it.url.trim()&&!isValidUrl(it.url);
    box.classList.toggle('warn-url',bad);
  });
}
function updateUrlBanner(){
  const bad=items.filter(i=>i.url&&i.url.trim()&&!isValidUrl(i.url)).length;
  const empty=items.filter(i=>!i.url||!i.url.trim()||i.url==='https://').length;
  const el=$('urlBanner');
  if(bad){el.textContent=`⚠ URL 형식 오류 ${bad}개 · http(s):// 로 시작하는지 확인`;el.classList.add('show')}
  else if(empty&&items.length){el.textContent=`빈 URL ${empty}개 · 캡션 복사·QR에는 유효한 링크만 사용됩니다`;el.classList.add('show')}
  else{el.classList.remove('show');el.textContent=''}
}

let dragId=null;
function bindDrag(el){
  el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragId=null;document.querySelectorAll('.item').forEach(x=>x.classList.remove('drag-over'))});
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drag-over');
    if(!dragId||dragId===el.dataset.id) return;
    syncItemsFromDOM();
    const from=items.findIndex(i=>String(i.id)===dragId);
    const to=items.findIndex(i=>String(i.id)===el.dataset.id);
    if(from<0||to<0) return;
    const [m]=items.splice(from,1);
    items.splice(to,0,m);
    rebuildItems();render();save();
  });
}

function applyBulkPaste(){
  const raw=$('bulkPaste').value||'';
  const blocks=raw.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(!blocks.length){alert('붙여넣을 내용이 없습니다.');return}
  let n=0;
  blocks.forEach(line=>{
    let title='',desc='',url='',type='other';
    if(line.includes('|')){
      const p=line.split('|').map(s=>s.trim());
      title=p[0]||'';desc=p[1]||'';url=p[2]||'';
    } else if(/^https?:\/\//i.test(line)){
      url=line;title=shortUrl(line);
    } else {
      title=line;
    }
    if(/^https?:\/\//i.test(url)||title){
      items.push({id:Date.now()+Math.random()+n,title,desc,url,type});
      n++;
    }
  });
  $('bulkPaste').value='';
  rebuildItems();render();save();
  alert(`${n}개 항목을 추가했습니다.`);
}

function pages(){
  const n=Math.max(1,Number($('perPage').value)||4);
  if(!items.length) return [[]];
  const out=[];
  for(let i=0;i<items.length;i+=n) out.push(items.slice(i,i+n));
  return out.length?out:[[]];
}
function rebuildPills(){
  const ps=pages();
  if(pageIndex>=ps.length) pageIndex=Math.max(0,ps.length-1);
  const el=$('pagePills');el.innerHTML='';
  ps.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='pill'+(i===pageIndex?' on':'');
    b.textContent=`${i+1}/${ps.length}`;
    b.onclick=()=>{pageIndex=i;render()};
    el.appendChild(b);
  });
}
function itemGlobalIndex(page,local){
  const n=Number($('perPage').value)||4;
  return (n>=99?0:page*n)+local;
}

function parseMarkup(t){return String(t||'').split('**').map((s,i)=>({text:s,hl:i%2===1}))}
function measureMarkupHeight(ctx,parts,maxW,size){
  let cx=0,lines=1;
  parts.forEach(p=>{
    ctx.font=fontStack(size,p.hl?'800':'500');
    for(const ch of p.text){
      const w=ctx.measureText(ch).width;
      if(cx+w>maxW){cx=0;lines++}
      cx+=w;
    }
  });
  return lines*size*1.35;
}
function drawMarkupLine(ctx,parts,x,y,maxW,size,col,hlCol){
  let cx=x,cy=y;
  parts.forEach(p=>{
    ctx.font=fontStack(size,p.hl?'800':'500');
    ctx.fillStyle=p.hl?hlCol:col;
    for(const ch of p.text){
      const w=ctx.measureText(ch).width;
      if(cx+w>x+maxW){cx=x;cy+=size*1.35}
      ctx.fillText(ch,cx,cy);cx+=w;
    }
  });
  return cy+size*1.35;
}
function wrapPlain(ctx,text,maxW,font){
  ctx.font=font;const lines=[];let cur='';
  for(const ch of String(text||'')){
    const t=cur+ch;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=ch}else cur=t;
  }
  if(cur) lines.push(cur);return lines;
}
function shortUrl(u){try{const x=new URL(u);return x.host+x.pathname.replace(/\/$/,'')}catch(e){return (u||'').slice(0,40)}}

function buildQr(){
  return new Promise(resolve=>{
    if(!$('showQr').checked){qrDataUrl=null;resolve();return}
    let url=$('qrMode').value==='custom'?$('qrCustom').value.trim():firstValidUrl();
    if(!isValidUrl(url)){qrDataUrl=null;resolve();return}
    const host=$('qrHost');host.innerHTML='';
    try{
      new QRCode(host,{text:url,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});
      const tryGrab=(attempt)=>{
        const img=host.querySelector('img');
        const c=host.querySelector('canvas');
        if(img&&img.src&&img.complete&&img.naturalWidth){qrDataUrl=img.src;resolve();return}
        if(c&&c.width){qrDataUrl=c.toDataURL('image/png');resolve();return}
        if(attempt<20) setTimeout(()=>tryGrab(attempt+1),50);
        else{qrDataUrl=null;resolve()}
      };
      setTimeout(()=>tryGrab(0),0);
    }catch(e){qrDataUrl=null;resolve()}
  });
}
function loadImg(src){
  return new Promise(res=>{
    if(!src) return res(null);
    const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;
  });
}

function roundRect(ctx,x,y,w,h,r){
  const R=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();ctx.moveTo(x+R,y);ctx.arcTo(x+w,y,x+w,y+h,R);ctx.arcTo(x+w,y+h,x,y+h,R);
  ctx.arcTo(x,y+h,x,y,R);ctx.arcTo(x,y,x+w,y,R);ctx.closePath();
}
function drawFrame(ctx,W,H,style,th){
  if(style==='none') return;
  const inset=style==='thick'?18:10;
  ctx.strokeStyle=th.frame;ctx.lineWidth=style==='thick'?6:2;
  ctx.strokeRect(inset,inset,W-inset*2,H-inset*2);
}
function drawSafe(ctx,W,H){
  const top=H*.12,bot=H*.14;
  ctx.fillStyle='rgba(224,69,79,.15)';ctx.fillRect(0,0,W,top);ctx.fillRect(0,H-bot,W,bot);
  ctx.setLineDash([8,6]);ctx.strokeStyle='rgba(224,69,79,.85)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(W,top);ctx.moveTo(0,H-bot);ctx.lineTo(W,H-bot);ctx.stroke();ctx.setLineDash([]);
}

async function render(opts={}){
  const skipGuide=!!opts.skipGuide;
  const forcePage=opts.page!=null?opts.page:pageIndex;
  syncItemsFromDOM();
  await buildQr();

  const th=getCardTheme();
  currentTheme=th;
  const {W,H}=parseSize();
  const cv=$('cv');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  const accent=accentColor();
  const layout=$('layout').value;
  const ps=pages();
  const pageItems=ps[Math.min(forcePage,ps.length-1)]||[];
  const isLast=forcePage>=ps.length-1;
  const showFooter=!$('footerLastOnly').checked||isLast;
  const margin=Math.round(W*0.065);
  const scale=W/1080;
  const titleSz=Math.round(fsTitle()*scale);
  const bodySz=Math.round(fsBody()*scale);
  const descSz=Math.round(fsDesc()*scale);
  const linkSz=Math.round(fsLink()*scale);

  ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);

  let y=margin+8*scale;
  ctx.font=fontStack(15*scale,'700');ctx.fillStyle=accent;ctx.textAlign='left';
  ctx.fillText(($('series').value||'SOURCES').toUpperCase(),margin,y);
  ctx.fillStyle=th.soft;ctx.textAlign='right';ctx.font=fontStack(14*scale,'500');
  ctx.fillText($('dateStr').value.trim()||todayStr(),W-margin,y);ctx.textAlign='left';

  y+=28*scale;
  ctx.font=fontStack(20*scale,'800');ctx.fillStyle=th.text;
  ctx.fillText($('brand').value||'WEST150.DAILY',margin,y);

  if($('showVerdict').checked){
    const vt=$('verdictText').value||'판정';
    ctx.font=fontStack(13*scale,'800');
    const tw=ctx.measureText(vt).width;
    const bx=W-margin-tw-28*scale;
    ctx.fillStyle=accent;roundRect(ctx,bx,y-18*scale,tw+24*scale,26*scale,8);ctx.fill();
    ctx.fillStyle=th.verdictFg;ctx.fillText(vt,bx+12*scale,y);
  }

  y+=36*scale;
  ctx.strokeStyle=th.line;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(margin,y);ctx.lineTo(W-margin,y);ctx.stroke();
  y+=40*scale;

  let listLeft=margin,listWidth=W-margin*2;
  if(layout==='qrfocus'&&qrDataUrl){
    listWidth=W-margin*2-Math.round(180*scale);
  }

  y=drawMarkupLine(ctx,parseMarkup($('title').value),margin,y,listWidth,titleSz,th.text,accent);
  const sub=$('subtitle').value.trim();
  if(sub){y+=8*scale;ctx.font=fontStack(Math.round(titleSz*0.5),'400');ctx.fillStyle=th.muted;ctx.fillText(sub,margin,y);y+=28*scale}
  else y+=16*scale;

  if(layout==='qrfocus'&&qrDataUrl){
    const qs=Math.round(160*scale),qx=W-margin-qs,qy=y;
    ctx.fillStyle='#fff';roundRect(ctx,qx-10,qy-10,qs+20,qs+20,12);ctx.fill();
    const img=await loadImg(qrDataUrl);
    if(img) ctx.drawImage(img,qx,qy,qs,qs);
  }

  let footerBlock=showFooter?100*scale:36*scale;
  if(showFooter&&$('showQr').checked&&qrDataUrl&&layout!=='qrfocus') footerBlock=Math.max(footerBlock,120*scale);
  const maxY=H-margin-footerBlock;

  const sizeOpts={bodySz,descSz,linkSz};
  let drawn=0;
  if(layout==='cards') drawn=drawCards(ctx,pageItems,listLeft,y,listWidth,maxY,accent,scale,forcePage,sizeOpts,th);
  else if(layout==='compact') drawn=drawCompact(ctx,pageItems,listLeft,y,listWidth,maxY,accent,scale,forcePage,sizeOpts,th);
  else drawn=drawList(ctx,pageItems,listLeft,y,listWidth,maxY,accent,scale,forcePage,sizeOpts,th);

  lastOverflowCount=Math.max(0,pageItems.length-drawn);
  const ob=$('overflowBanner');
  if(lastOverflowCount>0){
    ob.textContent=`이 페이지에서 ${lastOverflowCount}개 항목이 영역에 안 들어가 숨겨졌습니다. 페이지당 개수를 줄이거나 글을 짧게 하세요.`;
    ob.classList.add('show');
  } else {ob.classList.remove('show');ob.textContent=''}

  if(showFooter){
    const fy=H-margin-20*scale;
    let ctaY=fy-28*scale;
    let ctaMaxW=W-margin*2;
    if($('showQr').checked&&qrDataUrl&&layout!=='qrfocus'){
      const qs=Math.round(88*scale);
      ctaMaxW=W-margin*2-qs-20*scale;
      ctx.fillStyle='#fff';roundRect(ctx,W-margin-qs-8,H-margin-qs-48*scale,qs+8,qs+8,8);ctx.fill();
      const img=await loadImg(qrDataUrl);
      if(img) ctx.drawImage(img,W-margin-qs-4,H-margin-qs-44*scale,qs,qs);
    }
    ctx.font=fontStack(16*scale,'600');ctx.fillStyle=accent;ctx.textAlign='left';
    const cta=$('cta').value||'';
    const ctaLines=wrapPlain(ctx,cta,ctaMaxW-(($('wm').value)?120*scale:0),ctx.font).slice(0,2);
    ctaLines.forEach((ln,i)=>ctx.fillText(ln,margin,ctaY+i*20*scale));
    const foot=$('footer').value.trim();
    if(foot){ctx.font=fontStack(13*scale,'400');ctx.fillStyle=th.faint;ctx.fillText(foot,margin,fy-4*scale)}
    const wm=$('wm').value;
    if(wm){
      ctx.font=fontStack(14*scale,'600');
      const ww=ctx.measureText(wm).width;
      const wx=W-margin-ww-36*scale;
      const wy=fy-18*scale;
      ctx.fillStyle=th.wmBg;roundRect(ctx,wx,wy-14*scale,ww+36*scale,30*scale,15);ctx.fill();
      ctx.fillStyle=accent;ctx.beginPath();ctx.arc(wx+14*scale,wy,4*scale,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=th.text;ctx.fillText(wm,wx+24*scale,wy+5*scale);
    }
  }

  if(ps.length>1){
    ctx.font=fontStack(13*scale,'600');ctx.fillStyle=th.faint;ctx.textAlign='center';
    ctx.fillText(`${forcePage+1} / ${ps.length}`,W/2,H-10*scale);ctx.textAlign='left';
  }

  drawFrame(ctx,W,H,$('frame').value,th);
  if(!skipGuide&&$('safeGuide').checked) drawSafe(ctx,W,H);
  rebuildPills();
}

function drawList(ctx,list,x,y,width,maxY,accent,scale,page,sz,th){
  const showUrl=$('showUrl').checked,showType=$('showType').checked,showDesc=$('showDesc').checked,showNum=$('showNum').checked;
  const bodySz=sz.bodySz,descSz=sz.descSz,linkSz=sz.linkSz;
  const typeSize=Math.round(12*scale);
  let drawn=0;
  for(let i=0;i<list.length;i++){
    const it=list[i];
    const tx=x+(showNum?36*scale:0);
    const tw=width-(showNum?36*scale:0);
    let need=28*scale;
    if(showType) need+=typeGap(typeSize,bodySz,scale);
    need+=measureMarkupHeight(ctx,parseMarkup(it.title||'제목'),tw,bodySz);
    if(showDesc&&it.desc) need+=descSz*2.6+8*scale;
    if(showUrl&&it.url) need+=linkSz+8*scale;
    need+=16*scale;
    if(y+need>maxY) break;

    const gi=itemGlobalIndex(page,i);
    const num=CIRCLED[gi]||String(gi+1);
    if(showNum){ctx.font=fontStack(22*scale,'900');ctx.fillStyle=accent;ctx.fillText(num,x,y)}
    let cy=y;
    if(showType){
      const tag=TYPES[it.type]||'기타';
      ctx.font=fontStack(typeSize,'700');
      const tagW=ctx.measureText(tag).width;
      const badgeH=Math.round(typeSize*1.55);
      ctx.fillStyle=accent+'33';
      roundRect(ctx,tx,cy-typeSize*0.95,tagW+14*scale,badgeH,6);ctx.fill();
      ctx.fillStyle=accent;ctx.fillText(tag,tx+7*scale,cy);
      cy+=typeGap(typeSize,bodySz,scale);
    }
    cy=drawMarkupLine(ctx,parseMarkup(it.title||'제목 없음'),tx,cy,tw,bodySz,th.text,accent);
    if(showDesc&&it.desc){
      ctx.font=fontStack(descSz,'400');ctx.fillStyle=th.muted;
      wrapPlain(ctx,it.desc,tw,ctx.font).slice(0,2).forEach(ln=>{ctx.fillText(ln,tx,cy);cy+=descSz*1.35});
    }
    if(showUrl&&it.url){
      ctx.font=fontStack(linkSz,'400');ctx.fillStyle=th.faint;
      const u=it.url.length>48?it.url.slice(0,48)+'…':it.url;
      ctx.fillText(u,tx,cy);cy+=linkSz+6*scale;
    }
    y=cy+18*scale;
    drawn++;
  }
  return drawn;
}

function drawCompact(ctx,list,x,y,width,maxY,accent,scale,page,sz,th){
  const bodySz=sz.bodySz;
  let drawn=0;
  for(let i=0;i<list.length;i++){
    const it=list[i];
    const line=(it.title||'').replace(/\*\*/g,'')+(it.url?'  ·  '+shortUrl(it.url):'');
    ctx.font=fontStack(bodySz,'500');
    const lines=wrapPlain(ctx,line,width-40*scale,ctx.font).slice(0,2);
    const need=lines.length*bodySz*1.35+14*scale;
    if(y+need>maxY) break;
    const gi=itemGlobalIndex(page,i);
    ctx.font=fontStack(bodySz,'800');ctx.fillStyle=accent;ctx.fillText(CIRCLED[gi]||String(gi+1),x,y);
    ctx.font=fontStack(bodySz,'500');ctx.fillStyle=th.compact;
    let ly=y;lines.forEach(ln=>{ctx.fillText(ln,x+32*scale,ly);ly+=bodySz*1.35});
    y=ly+12*scale;drawn++;
  }
  return drawn;
}

function measureCardHeight(ctx,it,cardW,scale,sz){
  let h=24*scale;
  const inner=cardW-36*scale;
  const typeSize=Math.round(11*scale);
  if($('showType').checked){
    h+=typeGap(typeSize,sz.bodySz,scale);
  }
  h+=measureMarkupHeight(ctx,parseMarkup(it.title||''),inner,sz.bodySz);
  if($('showDesc').checked&&it.desc){
    ctx.font=fontStack(sz.descSz,'400');
    h+=Math.min(2,wrapPlain(ctx,it.desc,inner,ctx.font).length)*sz.descSz*1.35+4*scale;
  }
  if($('showUrl').checked&&it.url) h+=sz.linkSz+8*scale;
  h+=20*scale;
  return h;
}

function drawCards(ctx,list,x,y,width,maxY,accent,scale,page,sz,th){
  const gap=12*scale;
  const col=width>700*scale?2:1;
  const cardW=(width-(col-1)*gap)/col;
  const colY=Array.from({length:col},()=>y);
  const typeSize=Math.round(11*scale);
  let drawn=0;
  for(let i=0;i<list.length;i++){
    const it=list[i];
    const c=i%col;
    let cy=colY[c];
    const h=measureCardHeight(ctx,it,cardW,scale,sz);
    if(cy+h>maxY) break;
    const cx=x+c*(cardW+gap);
    ctx.fillStyle=th.card;ctx.strokeStyle=th.cardBorder;ctx.lineWidth=1.5;
    roundRect(ctx,cx,cy,cardW,h,14);ctx.fill();ctx.stroke();
    ctx.fillStyle=accent;roundRect(ctx,cx,cy,5*scale,h,3);ctx.fill();

    let ty=cy+22*scale;
    if($('showType').checked){
      ctx.font=fontStack(typeSize,'700');
      ctx.fillStyle=accent;
      ctx.fillText(TYPES[it.type]||'',cx+18*scale,ty);
      ty+=typeGap(typeSize,sz.bodySz,scale);
    }
    ty=drawMarkupLine(ctx,parseMarkup(it.title||''),cx+18*scale,ty,cardW-36*scale,sz.bodySz,th.text,accent);
    if($('showDesc').checked&&it.desc){
      ctx.font=fontStack(sz.descSz,'400');ctx.fillStyle=th.muted;
      wrapPlain(ctx,it.desc,cardW-36*scale,ctx.font).slice(0,2).forEach(ln=>{
        ctx.fillText(ln,cx+18*scale,ty);ty+=sz.descSz*1.35;
      });
    }
    if($('showUrl').checked&&it.url){
      ctx.font=fontStack(sz.linkSz,'400');ctx.fillStyle=th.faint;
      ctx.fillText(shortUrl(it.url),cx+18*scale,ty+2*scale);
    }
    colY[c]=cy+h+gap;
    drawn++;
  }
  return drawn;
}

function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function canvasToBlob(cv){return new Promise(res=>cv.toBlob(res,'image/png'))}

async function saveCurrent(){
  await render({skipGuide:true,page:pageIndex});
  const blob=await canvasToBlob($('cv'));
  await deliverBlob(blob,`sources_p${pageIndex+1}_${Date.now()}.png`);
  await render();
}
async function saveAllPages(){
  const ps=pages();
  if(ps.length===1){await saveCurrent();return}
  if(isIOS()){
    const ok=confirm(`아이폰: ${ps.length}장을 한 장씩 저장합니다.\n각 화면에서 길게 눌러 저장한 뒤 「저장 완료 · 닫기」를 눌러 주세요.`);
    if(!ok) return;
    for(let i=0;i<ps.length;i++){
      pageIndex=i;
      await render({skipGuide:true,page:i});
      const blob=await canvasToBlob($('cv'));
      $('iosMsg').innerHTML=`(${i+1}/${ps.length}) 이미지를 <b>길게 누른 뒤</b> 저장하세요<br>끝나면 「저장 완료 · 닫기」`;
      await deliverBlob(blob,`sources_p${i+1}.png`,true);
    }
    $('iosMsg').innerHTML=`이미지를 <b>길게 누른 뒤</b><br>「사진에 추가 / 이미지 저장」을 선택하세요`;
    await render();
    return;
  }
  const zip=new JSZip();
  for(let i=0;i<ps.length;i++){
    await render({skipGuide:true,page:i});
    zip.file(`${String(i+1).padStart(2,'0')}_source.png`,await canvasToBlob($('cv')));
  }
  saveAs(await zip.generateAsync({type:'blob'}),`sources_${Date.now()}.zip`);
  await render();
}

async function deliverBlob(blob,filename,waitClose){
  if(!blob){alert('이미지 생성 실패');return}
  const file=new File([blob],filename,{type:'image/png'});
  if(!isIOS()&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return}catch(e){}
  }
  const url=URL.createObjectURL(blob);
  if(isIOS()){
    await showIosOverlay(url,blob,filename,waitClose);
    return;
  }
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

function showIosOverlay(url,blob,filename){
  return new Promise(resolve=>{
    const ov=$('iosOverlay');const img=$('iosImg');
    img.src=url;ov.classList.add('show');
    $('iosShareBtn').onclick=async()=>{
      try{
        const file=new File([blob],filename,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file]});
        else alert('공유를 지원하지 않습니다. 이미지를 길게 눌러 저장하세요.');
      }catch(e){}
    };
    const finish=()=>{
      ov.classList.remove('show');
      if(img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
      img.src='';
      $('iosCloseBtn').onclick=null;
      resolve();
    };
    $('iosCloseBtn').onclick=finish;
  });
}

function copyCaption(){
  syncItemsFromDOM();
  const lines=[$('title').value.replace(/\*\*/g,''),''];
  items.forEach((it,i)=>{
    lines.push(`${i+1}. ${(it.title||'').replace(/\*\*/g,'')}`);
    if(it.desc) lines.push(`   ${it.desc}`);
    if(it.url) lines.push(`   ${it.url}`);
  });
  lines.push('', $('cta').value, $('wm').value);
  const text=lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('캡션용 텍스트를 복사했습니다.')).catch(()=>prompt('복사:',text));
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(collectState(),null,2)],{type:'application/json'});
  saveAs(blob,`sources_backup_${Date.now()}.json`);
}
function importJSON(e){
  const f=e.target.files[0];if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      applyState(JSON.parse(ev.target.result));rebuildItems();syncFsLabels();render();save();
      alert('불러왔습니다.');
    }catch(err){alert('JSON 형식이 올바르지 않습니다.')}
    e.target.value='';
  };
  r.readAsText(f);
}

function collectState(){
  syncItemsFromDOM();
  return{
    accent:$('accent').value,size:$('size').value,layout:$('layout').value,cardTheme:$('cardTheme').value,
    series:$('series').value,dateStr:$('dateStr').value,title:$('title').value,subtitle:$('subtitle').value,
    showVerdict:$('showVerdict').checked,verdict:$('verdict').value,verdictText:$('verdictText').value,
    brand:$('brand').value,wm:$('wm').value,cta:$('cta').value,footer:$('footer').value,fontFamily:$('fontFamily').value,
    fsTitle:fsTitle(),fsBody:fsBody(),fsDesc:fsDesc(),fsLink:fsLink(),
    showUrl:$('showUrl').checked,showType:$('showType').checked,showDesc:$('showDesc').checked,showNum:$('showNum').checked,
    showQr:$('showQr').checked,qrMode:$('qrMode').value,qrCustom:$('qrCustom').value,
    perPage:$('perPage').value,footerLastOnly:$('footerLastOnly').checked,safeGuide:$('safeGuide').checked,frame:$('frame').value,
    items
  };
}
function applyState(s){
  const set=(id,v)=>{if($(id)&&v!=null)$(id).value=v};
  set('accent',s.accent);if(s.accent) setAccent(s.accent);
  set('size',s.size);set('layout',s.layout);set('cardTheme',s.cardTheme||'dark');
  set('series',s.series);set('dateStr',s.dateStr);
  set('title',s.title);set('subtitle',s.subtitle);
  if($('showVerdict')&&s.showVerdict!=null)$('showVerdict').checked=!!s.showVerdict;
  set('verdict',s.verdict);set('verdictText',s.verdictText);
  set('brand',s.brand);set('wm',s.wm);set('cta',s.cta);set('footer',s.footer);set('fontFamily',s.fontFamily);
  if(s.fsTitle!=null) set('fsTitle',s.fsTitle);
  if(s.fsBody!=null) set('fsBody',s.fsBody);
  if(s.fsDesc!=null) set('fsDesc',s.fsDesc);
  if(s.fsLink!=null) set('fsLink',s.fsLink);
  ['showUrl','showType','showDesc','showNum','showQr','footerLastOnly','safeGuide'].forEach(k=>{if($(k)&&s[k]!=null)$(k).checked=!!s[k]});
  set('qrMode',s.qrMode);set('qrCustom',s.qrCustom);set('perPage',s.perPage);set('frame',s.frame);
  items=(s.items||[]).map((it,i)=>({...it,id:it.id||Date.now()+i}));
}
function save(){if(!appReady)return;try{localStorage.setItem(STORAGE,JSON.stringify(collectState()))}catch(e){}}
let saveT;function saveDebounced(){clearTimeout(saveT);saveT=setTimeout(save,400)}
function load(){
  const raw=localStorage.getItem(STORAGE);
  if(!raw){
    items=[
      {id:1,title:'**미 국무부** 여행경보',desc:'travel.state.gov 공식 안내',url:'https://travel.state.gov',type:'official'},
      {id:2,title:'스페인 정부 보도자료',desc:'현장 병력·경찰 배치 관련',url:'https://',type:'official'},
      {id:3,title:'주요 외신 보도',desc:'경보 상향 배경 설명',url:'https://',type:'press'}
    ];rebuildItems();return;
  }
  try{applyState(JSON.parse(raw));rebuildItems();syncFsLabels()}catch(e){items=[];rebuildItems()}
}
function resetAll(){if(!confirm('초기화할까요?'))return;localStorage.removeItem(STORAGE);location.reload()}

window.onload=async()=>{initTheme();load();syncFsLabels();appReady=true;await render()};
</script>
